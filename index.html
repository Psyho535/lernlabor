<style>
body{margin:0}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.navbar{top:0!important;height:calc(52px + env(safe-area-inset-top,0px))!important;padding-top:env(safe-area-inset-top,0px)!important}
.island{top:calc(10px + env(safe-area-inset-top,0px))!important}

<body><style>
:root{
  /* Layout: app shell aus Glasscheiben über einem Farbverlauf. Jede OSI-Schicht hat ihre eigene Farbe (HUE im Script),
     große Titel klappen in eine gläserne Leiste ein, auf dem Handy schwebt die Tab-Leiste. */
  --bg:#dcdee2;
  --side:rgba(255,255,255,.5);
  --surface:rgba(255,255,255,.55);
  --face:rgba(255,255,255,.9);
  --fill:rgba(20,20,26,.08);
  --fill-2:rgba(20,20,26,.05);
  --fill-3:rgba(20,20,26,.18);
  --label:#111114;
  --label-2:rgba(25,25,30,.68);
  --label-3:rgba(25,25,30,.38);
  --sep:rgba(20,20,26,.13);
  --accent:#1d1d21;
  --accent-tint:rgba(20,20,26,.08);
  --grad:#1c1c1e;
  --on-grad:#fff;
  --grad-glow:rgba(0,0,0,.4);
  --solid:#f5f6f8;
  --o1:#ffffff;
  --o2:#a9acb3;
  --green:#1fbf63;
  --green-ink:#14803f;
  --red:#ff3b5c;
  --red-ink:#cf1236;
  --material:rgba(255,255,255,.6);
  --material-strong:rgba(255,255,255,.88);
  --thumb:rgba(255,255,255,.95);
  --island:#111114;
  --island-edge:transparent;
  --glass-edge:rgba(255,255,255,.8);
  --specular:rgba(255,255,255,.55);
  --orb:.6;
  --card-shadow:0 20px 44px -28px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.8);
  --pop-shadow:0 14px 40px -14px rgba(0,0,0,.4);
  --ease-ios:cubic-bezier(.32,.72,0,1);
  --ease-soft:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.3,1.12,.5,1);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Geist",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Geist",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Geist Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--side:rgba(22,22,24,.55);--surface:rgba(255,255,255,.11);--face:#1c1c1e;--glass-edge:rgba(255,255,255,.07);--specular:transparent;--orb-show:none;--tint:0;--o1:#eceef2;--o2:#8f939b;--grad:#ffffff;--on-grad:#000000;--grad-glow:transparent;--solid:#1c1c1e;
    --fill:rgba(255,255,255,.1);--fill-2:rgba(255,255,255,.06);--fill-3:rgba(255,255,255,.2);
    --label:#ffffff;--label-2:rgba(235,235,245,.62);--label-3:rgba(235,235,245,.34);--sep:rgba(255,255,255,.14);
    --accent:#ffffff;--accent-tint:rgba(255,255,255,.12);
    --green:#2fe08a;--green-ink:#52eba2;--red:#ff4f70;--red-ink:#ff8aa0;
    --material:rgba(24,24,26,.6);--material-strong:rgba(38,38,41,.92);--thumb:rgba(255,255,255,.2);
    --island:#1c1c1e;--island-edge:rgba(255,255,255,.12);
    --card-shadow:none;
    --pop-shadow:0 14px 40px -14px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--side:rgba(22,22,24,.55);--surface:rgba(255,255,255,.11);--face:#1c1c1e;--glass-edge:rgba(255,255,255,.07);--specular:transparent;--orb-show:none;--tint:0;--o1:#eceef2;--o2:#8f939b;--grad:#ffffff;--on-grad:#000000;--grad-glow:transparent;--solid:#1c1c1e;
  --fill:rgba(255,255,255,.1);--fill-2:rgba(255,255,255,.06);--fill-3:rgba(255,255,255,.2);
  --label:#ffffff;--label-2:rgba(235,235,245,.62);--label-3:rgba(235,235,245,.34);--sep:rgba(255,255,255,.14);
  --accent:#ffffff;--accent-tint:rgba(255,255,255,.12);
  --green:#2fe08a;--green-ink:#52eba2;--red:#ff4f70;--red-ink:#ff8aa0;
  --material:rgba(24,24,26,.6);--material-strong:rgba(38,38,41,.92);--thumb:rgba(255,255,255,.2);
  --island:#1c1c1e;--island-edge:rgba(255,255,255,.12);
  --card-shadow:none;
  --pop-shadow:0 14px 40px -14px rgba(0,0,0,.9);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:16px/1.47 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.ic{display:block;flex:none}
.muted{color:var(--label-2)}
.small{font-size:13.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.sidebar{display:none}
main{padding-inline:16px;padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
.col{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:22px;min-width:0;padding-top:4px}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:260px;z-index:20;background:var(--side);border-right:.5px solid var(--sep);padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
  main{margin-left:260px;padding-inline:40px;padding-block:0 64px}
  .tabbar{display:none!important}
}
.side-head{display:flex;align-items:center;gap:12px;padding:0 10px 22px}
.app-mark{width:38px;height:38px;flex:none;border-radius:10px;background:var(--label);display:flex;flex-direction:column;justify-content:center;gap:3.5px;padding:0 9px}
.app-mark i{display:block;height:3.5px;border-radius:2px;background:var(--surface)}
.app-mark i:nth-child(2){margin-right:3px}
.app-mark i:nth-child(3){margin-right:6px}
.side-head b{font:700 16px/1.2 var(--f-display);display:block;letter-spacing:-.01em}
.side-head small{font-size:12.5px;color:var(--label-2)}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:500;cursor:pointer;text-align:left;width:100%;color:var(--label);transition:background .15s,color .15s}
.side-item .ic{color:var(--accent)}
.side-item:hover{background:var(--fill-2)}
.side-item[aria-current="page"]{background:var(--accent);color:#fff}
.side-item[aria-current="page"] .ic{color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:16px 12px 0}
.side-prog .top{display:flex;justify-content:space-between;font-size:13px;color:var(--label-2);margin-bottom:7px}
.side-prog .top b{color:var(--label);font-variant-numeric:tabular-nums}
.sync-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--label-2)}

.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:52px;margin-inline:-16px;padding-inline:6px;border-bottom:.5px solid transparent;transition:background-color .3s,border-color .3s}
.navbar.scrolled{background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom-color:var(--sep)}
@media (min-width:900px){.navbar{margin-inline:-40px;padding-inline:26px}}
.nb-left{justify-self:start;min-width:0;display:flex}
.nb-right{justify-self:end;min-width:0;display:flex;gap:4px}
.nav-title{font-weight:620;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,420px);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .4s var(--ease-ios)}
.navbar.scrolled .nav-title{opacity:1;transform:none}
.back,.nb-btn{display:inline-flex;align-items:center;gap:4px;height:40px;border:0;background:transparent;color:var(--accent);font-size:16.5px;border-radius:12px;cursor:pointer;transition:opacity .15s;white-space:nowrap;max-width:100%}
.back{padding:0 10px 0 2px;gap:0}
.back span{overflow:hidden;text-overflow:ellipsis}
.nb-btn{padding:0 10px}
.back:active,.nb-btn:active{opacity:.35}

.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),440px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;border-radius:999px;
  background:var(--material);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:.5px solid var(--sep);box-shadow:0 12px 32px -14px rgba(0,0,0,.35)}
.tab-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 4);border-radius:999px;background:var(--fill);transform:translateX(calc(var(--i,0) * 100%));transition:transform .46s cubic-bezier(.3,1.08,.4,1)}
.tab[aria-current="page"] .ic{animation:tabPick .46s var(--ease-soft)}
@keyframes tabPick{from{transform:scale(.84)}to{transform:none}}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;padding:0;border:0;background:transparent;border-radius:999px;color:var(--label-2);font-size:10.5px;font-weight:600;cursor:pointer;min-width:0;transition:color .2s}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ic{transition:transform .4s var(--ease-spring)}
.tab:active .ic{transform:scale(.8)}
.tab[aria-current="page"]{color:var(--accent)}

/* ---------- type & blocks ---------- */
.title-block{display:flex;flex-direction:column;gap:3px}
.kicker{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em}
.large{font:700 clamp(30px,6.2vw,36px)/1.12 var(--f-display);letter-spacing:-.025em;overflow-wrap:break-word;hyphens:auto}
.lede{font-size:16.5px;line-height:1.5;color:var(--label-2);max-width:60ch}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-t{font:700 21px/1.25 var(--f-display);letter-spacing:-.016em;padding-inline:2px}
.group-h{font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em;padding:4px 16px 0}
.group-f{font-size:13px;color:var(--label-2);padding:0 16px;line-height:1.45}
.group{background:var(--surface);border-radius:16px;overflow:hidden;min-width:0}
.cell,.kv,.opt,.target,.slot{position:relative}
.cell + .cell::before,.kv + .kv::before,.opt + .opt::before,.target + .target::before,.slot + .slot::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.cell{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px;width:100%;text-align:left;background:transparent;border:0;color:var(--label);font-size:16px;cursor:pointer;transition:background .2s}
.cell:active{background:var(--fill-2)}
.cell.static{cursor:default}
.cell.static:active{background:transparent}
.cell.with-badge{--inset:62px}
.cell-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cell-title{font-size:16px;font-weight:500;overflow-wrap:break-word;hyphens:auto}
.cell-sub{font-size:13.5px;color:var(--label-2);line-height:1.4}
.cell-sub.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell-detail{color:var(--label-2);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell .chev{color:var(--label-3)}
.cell.danger{color:var(--red-ink);justify-content:center;font-weight:500}
.cell-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.cell-ic.gray{background:var(--fill-3);color:var(--label)}
.ok-check{color:var(--green-ink)}
.badge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--fill);color:var(--label);font:650 15px/1 var(--f-display);font-variant-numeric:tabular-nums;flex:none;transition:background .3s,color .3s}
.badge.sm{width:26px;height:26px;border-radius:8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--fill-2);font-size:14px;font-weight:500;line-height:1.25}
.chip.accent{background:var(--accent-tint);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border-radius:20px;padding:20px;min-width:0}
@media (min-width:700px){.card{padding:24px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px}
.card-t{font:700 20px/1.2 var(--f-display);display:flex;align-items:center;gap:9px;letter-spacing:-.016em}
.card-t .ic{color:var(--c,var(--accent));flex:none}
.card-t .ic{color:var(--accent)}
.card p{line-height:1.55}
.card.tint{background:var(--accent-tint)}
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (max-width:899px),(min-width:1080px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .35s var(--ease-spring),background .2s,color .2s,opacity .2s}
.btn:active:not([disabled]){transform:scale(.95)}
.btn-fill{background:var(--accent);color:#fff}
.btn-tint{background:var(--accent-tint);color:var(--accent)}
.btn-gray{background:var(--fill);color:var(--label)}
.btn-plain{background:transparent;color:var(--accent);padding:0 6px;height:36px}
.btn-lg{height:52px;border-radius:14px;width:100%;font-size:17px}
.btn-round{width:52px;height:52px;border-radius:50%;padding:0}
.btn-round.big{width:64px;height:64px}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-ink)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:2px;border-radius:10px;background:var(--fill);isolation:isolate;min-width:0}
.seg-thumb{position:absolute;z-index:-1;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:8px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .4s var(--ease-ios)}
.seg button{position:relative;border:0;background:transparent;height:32px;padding:0 4px;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label);transition:transform .3s var(--ease-spring)}
.seg button[aria-pressed="true"]{font-weight:620}
.seg button:active{transform:scale(.95)}
.switch{width:51px;height:31px;border-radius:999px;background:var(--fill-3);position:relative;border:0;cursor:pointer;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .4s var(--ease-spring),width .2s var(--ease-ios)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:active::after{width:33px}
.switch[aria-checked="true"]:active::after{transform:translateX(14px)}
.bar{height:4px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .9s var(--ease-ios)}

/* ---------- start ---------- */
.prog-row{display:flex;align-items:center;gap:20px}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-label b{font:700 26px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-label small{font-size:11.5px;color:var(--label-2);margin-top:5px}
.prog-info{display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.prog-label{font:700 22px/1.2 var(--f-display);letter-spacing:-.02em}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
@media (min-width:600px){.stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini{background:var(--fill-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.mini span{font-size:12.5px;color:var(--label-2)}
.mini b{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:0;text-align:left;cursor:pointer;min-width:0;color:var(--label);transition:transform .4s var(--ease-spring)}
.tile:active{transform:scale(.95)}
.tile-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.tile b{font:650 16px/1.25 var(--f-display);display:block}
.tile small{display:block;color:var(--label-2);font-size:13.5px;margin-top:3px;line-height:1.35}
.mnemo{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:14px}
.mw{display:flex;flex-direction:column;line-height:1.1}
.mw-word{font:600 19px var(--f-display);letter-spacing:-.01em}
.mw-word b{color:var(--accent);font-weight:780}
.mw small{color:var(--label-2);font-size:12px;margin-top:5px}
.mnemo.swap{animation:rise .45s var(--ease-ios)}
.fact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.fact-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--accent-tint)}
.fact p{font-size:16.5px;line-height:1.5;margin:4px 0 10px;max-width:62ch}
.fact p.swap{animation:rise .45s var(--ease-ios)}

/* ---------- layer detail ---------- */
.layer-pick{display:flex;gap:8px;flex-wrap:wrap}
.lp{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--label);font:650 15px var(--f-display);cursor:pointer;transition:transform .35s var(--ease-spring),background .2s,color .2s}
.lp:active{transform:scale(.86)}
.lp[aria-current="page"]{background:var(--accent);color:#fff}
.lp.learned::after{content:"";position:absolute;right:1px;top:1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.layer-en{color:var(--label-2);font-size:15.5px;margin-top:4px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ticks li{display:grid;grid-template-columns:7px minmax(0,1fr);gap:11px;align-items:start;line-height:1.4;padding:9px 0}
.ticks li + li{border-top:1px solid var(--sep)}
.ticks li:first-child{padding-top:0}
.ticks li:last-child{padding-bottom:0}
.ticks li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent));margin-top:7px}
.ticks.warn li::before{background:var(--red)}
.kv{display:grid;grid-template-columns:minmax(104px,auto) minmax(0,1fr);gap:4px 16px;padding:13px 16px;align-items:baseline}
.kv dt{color:var(--label-2);font-size:15px}
.kv dd{margin:0;font-size:15.5px;overflow-wrap:anywhere}
dl.group{margin:0}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.frame-bar{display:flex;gap:4px;min-width:620px}
.fb{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 8px;border-radius:10px;min-width:0;background:var(--fill)}
.fb.phy{background:transparent;border:1px dashed var(--fill-3)}
.fb.pay{background:var(--accent-tint)}
.fb b{font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb.pay b{color:var(--accent)}
.fb small{font:500 11.5px var(--f-mono);color:var(--label-2)}
.media3{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:620px){.media3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcell{padding:14px;border-radius:14px;background:var(--fill-2)}
.mcell b{display:block;margin-bottom:4px;font-weight:620}
.mcell p{color:var(--label-2);font-size:14px;line-height:1.5}
.sub-h{font:620 14px var(--f-ui);color:var(--label-2);margin:20px 0 10px}
.sublayer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:14px;background:var(--fill-2)}
.sublayer + .sublayer{margin-top:8px}
.sublayer p{color:var(--label-2);font-size:14px;margin-top:2px}
.handshake{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.hs-end{font-weight:620;font-size:14px;padding:6px 12px;border-radius:10px;background:var(--fill)}
.hs-arrow{position:relative;height:28px;display:flex;align-items:center;justify-content:center}
.hs-arrow::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--accent)}
.hs-arrow::after{content:"";position:absolute;top:50%;right:1px;width:8px;height:8px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.hs-arrow.back::after{right:auto;left:1px;transform:translateY(-50%) rotate(-135deg)}
.hs-arrow span{position:relative;background:var(--surface);padding:2px 10px;border-radius:999px;font:600 12.5px var(--f-mono);color:var(--accent);border:1px solid var(--accent-tint)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t.wide{min-width:760px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--label-2);font-weight:600;padding:8px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:.5px solid var(--sep);vertical-align:top;line-height:1.45}
.t tr:last-child td{border-bottom:0}
.t td.mono{white-space:nowrap}
.t .lname{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}

/* ---------- encapsulation ---------- */
.enc-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (max-width:899px),(min-width:1060px){.enc-grid{grid-template-columns:176px minmax(0,1fr)}}
.who{font-size:12.5px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.steps-ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ms{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border-radius:10px;color:var(--label-3);font-size:14px;transition:background .35s var(--ease-ios),color .35s}
.ms .badge{width:26px;height:26px;border-radius:8px;font-size:13px;color:var(--label-3)}
.ms.done{color:var(--label-2)}
.ms.done .badge{color:var(--label)}
.ms .ok{margin-left:auto;color:var(--green-ink)}
.ms.active{background:var(--accent-tint);color:var(--accent);font-weight:620}
.ms.active .badge{background:var(--accent);color:#fff}
@media (max-width:639px),(min-width:900px) and (max-width:1059px){
  .steps-ms{flex-direction:row;justify-content:space-between}
  .ms{padding:4px;background:transparent!important}
  .ms span:not(.badge),.ms .ok{display:none}
}
.enc-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.enc-main.swap{animation:qIn .45s var(--ease-ios)}
.step-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--label-2)}
.enc-main h2{font:700 23px/1.22 var(--f-display);letter-spacing:-.02em}
.enc-main > p{font-size:16px;line-height:1.55;color:var(--label-2);max-width:60ch}
.packet{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:16px;background:var(--fill-2);min-height:72px;align-items:stretch}
.pkt{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:9px 12px;border-radius:11px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.07);min-width:0;transition:background .4s,color .4s}
.pkt b{font-size:14px;font-weight:650;white-space:nowrap}
.pkt small{font:500 11.5px var(--f-mono);color:var(--label-2);white-space:nowrap}
.pkt.data{flex:1 1 140px;background:transparent;box-shadow:none;border:1px dashed var(--fill-3)}
.pkt.new{background:var(--accent);color:#fff}
.pkt.new small{color:rgba(255,255,255,.82)}
.pkt.enter{animation:pktIn .6s var(--ease-spring)}
.pkt.leaving{opacity:.5;background:transparent;box-shadow:none;border:1px dashed var(--red);animation:leave .9s var(--ease-ios)}
.pkt.leaving b{text-decoration:line-through;color:var(--red-ink)}
.bits{display:flex;flex-direction:column;gap:10px;width:100%;padding:6px}
.bits code{font:500 13.5px/1.7 var(--f-mono);word-spacing:4px;overflow-wrap:anywhere}
.wave{width:100%;height:34px;display:block;animation:reveal 1.3s var(--ease-ios) both}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0}
.fields div{padding:10px 12px;border-radius:12px;background:var(--fill-2);min-width:0}
.fields dt{font-size:12px;color:var(--label-2)}
.fields dd{margin:2px 0 0;font:550 13.5px var(--f-mono);overflow-wrap:anywhere}
.media-ctrl{display:flex;align-items:center;justify-content:center;gap:20px;padding-top:18px;margin-top:18px;border-top:.5px solid var(--sep)}
.stepper{display:flex;gap:6px;justify-content:center;margin-top:14px}
.stepper button{width:8px;height:8px;border-radius:4px;background:var(--fill-3);border:0;padding:0;cursor:pointer;transition:width .45s var(--ease-ios),background .3s}
.stepper button.on{width:24px;background:var(--accent)}
.pdu-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pdu-chain .ic{color:var(--label-3)}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14.5px}
.calc + .calc{margin-top:10px}
.calc .eq{color:var(--label-3);font-weight:600}

/* ---------- trainieren ---------- */
.hub{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--surface);border:0;width:100%;text-align:left;cursor:pointer;color:var(--label);transition:transform .4s var(--ease-spring)}
.hub:active{transform:scale(.97)}
.hub .cell-ic{width:48px;height:48px;border-radius:14px}
.hub b{font:650 18px/1.25 var(--f-display);display:block;letter-spacing:-.01em}
.hub small{display:block;color:var(--label-2);font-size:14px;margin-top:2px}
.hub .chev{margin-left:auto;color:var(--label-3)}
.hist{position:relative;display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:24px;border-bottom:.5px solid var(--sep)}
.hist::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--sep)}
.hcol{position:relative;flex:1;max-width:40px;height:100%;display:flex;align-items:flex-end}
.hcol i{display:block;width:100%;height:var(--h);border-radius:6px 6px 2px 2px;background:var(--fill-3);min-height:3px;transform-origin:bottom;animation:grow .7s var(--ease-ios) both;animation-delay:calc(var(--k) * 40ms)}
.hcol:last-child i{background:var(--accent)}
.hcol span{position:absolute;left:0;right:0;bottom:calc(var(--h) + 4px);text-align:center;font-size:11px;color:var(--label-2);font-variant-numeric:tabular-nums}
.hcol:last-child span{color:var(--label);font-weight:650}
.hist-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--label-2);margin-top:6px}

/* ---------- quiz ---------- */
.modes{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mode{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:20px;background:var(--surface);border:0;text-align:left;cursor:pointer;color:var(--label);transition:transform .4s var(--ease-spring)}
.mode:active:not([disabled]){transform:scale(.96)}
.mode[disabled]{opacity:.45;cursor:not-allowed}
.mode .big{font:750 34px/1 var(--f-display);letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.mode b{font:650 17px var(--f-display)}
.mode span{color:var(--label-2);font-size:14px;line-height:1.4}
.qprog{height:4px;border-radius:4px;background:var(--fill);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .55s var(--ease-ios)}
.qcard{display:flex;flex-direction:column;gap:18px}
.qcard.in{animation:qIn .46s var(--ease-soft)}
.qcard.in .opt{animation:cellIn .46s var(--ease-soft) backwards;animation-delay:calc(var(--k,0) * 36ms + 70ms)}
.qtext{font:650 clamp(20px,3.2vw,25px)/1.3 var(--f-display);letter-spacing:-.016em;max-width:44ch}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) 22px;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:0;background:transparent;font-size:16px;line-height:1.4;cursor:pointer;color:var(--label);transition:background .25s,opacity .3s;--inset:58px}
.opt:active:not([disabled]){background:var(--fill-2)}
.opt .key{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:650 13px var(--f-display);background:var(--fill);color:var(--label-2)}
.opt[disabled]{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--green) 14%,transparent)}
.opt.ok .key{background:var(--green);color:#fff;animation:pop .5s var(--ease-spring)}
.opt.no{background:color-mix(in srgb,var(--red) 11%,transparent);animation:shake .26s ease-out}
.opt.no .key{background:var(--red);color:#fff}
.opt.dim{opacity:.42}
.opt .mark{color:var(--green-ink)}
.opt.no .mark{color:var(--red-ink)}
.explain{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:16px;border-radius:16px;background:var(--fill-2);font-size:15.5px;line-height:1.55;animation:rise .46s var(--ease-soft)}
.explain b{display:block;margin-bottom:2px}
.explain.good b,.explain.good .ic{color:var(--green-ink)}
.explain.bad b,.explain.bad .ic{color:var(--red-ink)}
.result-head{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.rv{padding:16px;display:flex;flex-direction:column;gap:6px}
.rv + .rv{border-top:.5px solid var(--sep)}
.rv b{font-weight:620;line-height:1.4}
.rv .yours{color:var(--red-ink);font-size:14.5px}
.rv .right{color:var(--green-ink);font-size:14.5px;font-weight:600}
.rv p{color:var(--label-2);font-size:14.5px}
.kbd{font:600 11px var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--fill);color:var(--label-2)}

/* ---------- flashcards ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.deck{position:relative;width:100%;max-width:560px}
.deck::before,.deck::after{content:"";position:absolute;left:6%;right:6%;bottom:-10px;height:40px;border-radius:24px;background:var(--surface);opacity:.6;z-index:0;box-shadow:var(--card-shadow)}
.deck::after{left:12%;right:12%;bottom:-19px;opacity:.35}
.flash{position:relative;z-index:1;perspective:1600px;width:100%;height:clamp(250px,42vw,320px);cursor:pointer;border-radius:24px;animation:cardIn .46s var(--ease-soft)}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .6s var(--ease-soft);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);box-shadow:var(--card-shadow);padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;overflow:auto}
.face.answer{transform:rotateY(180deg)}
.face-q{font:700 clamp(22px,3.6vw,30px)/1.2 var(--f-display);letter-spacing:-.02em;max-width:22ch}
.face-a{font-size:clamp(16.5px,2.3vw,19px);line-height:1.5;font-weight:500;max-width:38ch}
.face .hint{font-size:12.5px;color:var(--label-3)}
.flash.fly-right{animation:flyR .26s cubic-bezier(.5,0,.75,0) forwards}
.flash.fly-left{animation:flyL .26s cubic-bezier(.5,0,.75,0) forwards}
.card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin-top:8px}
.card-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;color:var(--label-2);font-size:13.5px;text-align:center}
.done-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:560px}
.done-card h2{font:700 25px var(--f-display);letter-spacing:-.02em}
.toggle-cell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px}

/* ---------- exercises ---------- */
.assign{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (max-width:899px),(min-width:1060px){.assign{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}}
.pool{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:10;box-shadow:var(--card-shadow)}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;border:0;background:var(--fill);font-weight:600;font-size:15px;cursor:grab;color:var(--label);transition:transform .35s var(--ease-spring),background .2s,color .2s}
.tchip:active{transform:scale(.9)}
.tchip[aria-pressed="true"]{background:var(--accent);color:#fff;transform:scale(1.05)}
.tchip.shake{animation:shake .42s;background:color-mix(in srgb,var(--red) 16%,transparent)}
.target{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 16px;width:100%;text-align:left;cursor:pointer;min-height:58px;border:0;background:transparent;color:var(--label);transition:background .2s;--inset:62px}
.target:active:not([disabled]){background:var(--fill-2)}
.target.over{background:var(--accent-tint)}
.target .plus{color:var(--accent);opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s var(--ease-spring)}
.target.ready .plus{opacity:1;transform:none}
.tg-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.tg-main > b{font-weight:500;font-size:15.5px}
.placed{display:flex;flex-wrap:wrap;gap:6px}
.placed:empty{display:none}
.placed .chip{font-size:13px;padding:4px 10px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green-ink)}
.placed .chip.new{animation:pop .5s var(--ease-spring)}
.target.flash-ok{animation:okFlash .8s var(--ease-ios)}
.target.flash-bad{animation:badFlash .7s var(--ease-ios),shake .42s}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:14px;color:var(--label-2)}
.status b{color:var(--label);font-variant-numeric:tabular-nums}
.order{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px) and (max-width:899px),(min-width:1060px){.order{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.slot{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;color:var(--label-3);font-size:15px;--inset:60px}
.slot.filled{color:var(--label);font-weight:500}
.slot.filled .badge{background:var(--accent);color:#fff}
.slot.new{animation:okFlash .8s var(--ease-ios)}
.slot.new .badge{animation:pop .5s var(--ease-spring)}
.slot.next{color:var(--accent)}
.timer{font:700 42px/1 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.check-draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s var(--ease-ios) forwards}
.big-check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;animation:pop .55s var(--ease-spring)}

/* ---------- facts ---------- */
.stats{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:14px;border-radius:14px;background:var(--fill-2);min-width:0}
.stat b{display:block;font:700 28px/1.05 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;font-weight:600;color:var(--accent);margin-left:4px;letter-spacing:0}
.stat span{font-size:13px;color:var(--label-2);display:block;margin-top:6px;line-height:1.35}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto repeat(7,minmax(46px,auto));gap:6px}
.cmp-h{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--label-2);padding:0 4px 2px}
.cmp-o{grid-column:1;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:500;font-size:14.5px;min-width:0;background:var(--fill-2)}
.cmp-o span:last-child{overflow-wrap:anywhere}
.cmp-t{grid-column:2;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 14px;border-radius:12px;background:var(--accent-tint);min-width:0}
.cmp-t b{font:650 15px var(--f-display);color:var(--accent)}
.cmp-t small{color:var(--label-2);font-size:12.5px;line-height:1.4}
.trouble .cell{align-items:flex-start;padding-block:14px}
.trouble .cell-sub{margin-bottom:8px}
.cmd{font:550 12.5px var(--f-mono);padding:3px 8px;border-radius:7px;background:var(--fill);white-space:nowrap}
.mnemo-grid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.mnemo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mnemo-box{padding:14px;border-radius:14px;background:var(--fill-2)}
.mnemo-box .mnemo{margin-top:8px;gap:8px 12px}
.mnemo-box .mw-word{font-size:16px}

/* ---------- island & sheet ---------- */
.island{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:100;display:flex;align-items:center;gap:10px;padding:9px 18px 9px 10px;border-radius:999px;background:var(--island);color:#fff;font-size:14.5px;font-weight:600;box-shadow:var(--pop-shadow);border:1px solid var(--island-edge);
  transform:translate(-50%,-150%) scale(.6);opacity:0;transition:transform .55s var(--ease-spring),opacity .25s;pointer-events:none;max-width:calc(100% - 32px)}
.island.show{transform:translate(-50%,0) scale(1);opacity:1}
.island .idot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);flex:none}
.island.good .idot{background:var(--green)}
.island.bad .idot{background:var(--red)}
.island span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){.island{left:calc(50% + 130px)}}
.sheet-wrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:12px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.34);animation:fade .3s}
.sheet{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;animation:sheetUp .5s var(--ease-ios)}
.sheet-group{background:var(--material-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:14px;overflow:hidden;text-align:center}
.sheet-msg{padding:16px 18px;font-size:13.5px;color:var(--label-2);line-height:1.4}
.sheet-msg b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.sheet-btn{display:block;width:100%;height:56px;border:0;border-top:.5px solid var(--sep);background:transparent;font-size:18px;color:var(--accent);cursor:pointer;transition:background .15s}
.sheet-btn:active{background:var(--fill)}
.sheet-btn.destructive{color:var(--red)}
.sheet-btn.cancel{font-weight:600;border-top:0}
.sheet-wrap.closing .sheet{animation:sheetDown .28s var(--ease-ios) forwards}
.sheet-wrap.closing .sheet-backdrop{animation:fade .28s reverse forwards}

/* ---------- motion ---------- */
.col.entering.enter-fade > *{animation:tabIn .36s var(--ease-soft) backwards;animation-delay:calc(var(--d,0) * 22ms + 70ms)}
/* Während des Übergangs kein Blur: Das spart viel Rechenleistung und bleibt auf dem Hintergrund unsichtbar. */
.col.entering .plate{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* Die Kinder animieren, nicht .col: Opazität am Elternteil würde den Glas-Blur der Karten kurz abschalten. */
.col.entering.enter-push > *{animation:pushIn .5s var(--ease-soft) backwards;animation-delay:calc(var(--d,0) * 32ms + 70ms)}
.col.entering.enter-pop > *{animation:popIn .5s var(--ease-soft) backwards;animation-delay:calc(var(--d,0) * 32ms + 70ms)}
.col.entering > .read-bar,.col.entering > .page-hero.morphing{animation:none!important}
/* Listen und Kacheln laufen weich nacheinander ein. */
.col.entering .group > *,.col.entering .mod-list > *,.col.entering .mod-tiles > *,.col.entering .tiles > *,.col.entering .stat-grid > *,.col.entering .stack > .prow{animation:cellIn .5s var(--ease-soft) backwards;animation-delay:calc(var(--d,0) * 32ms + var(--k,0) * 28ms + 70ms)}
.col.entering .pre *{animation:none!important}
.group > :nth-child(2),.mod-list > :nth-child(2),.mod-tiles > :nth-child(2),.tiles > :nth-child(2),.stat-grid > :nth-child(2),.stack > :nth-child(2),.opt:nth-child(2){--k:1}
.group > :nth-child(3),.mod-list > :nth-child(3),.mod-tiles > :nth-child(3),.tiles > :nth-child(3),.stat-grid > :nth-child(3),.stack > :nth-child(3),.opt:nth-child(3){--k:2}
.group > :nth-child(4),.mod-list > :nth-child(4),.mod-tiles > :nth-child(4),.tiles > :nth-child(4),.stat-grid > :nth-child(4),.stack > :nth-child(4),.opt:nth-child(4){--k:3}
.group > :nth-child(5),.mod-list > :nth-child(5),.tiles > :nth-child(5),.stack > :nth-child(5){--k:4}
.group > :nth-child(6),.mod-list > :nth-child(6),.tiles > :nth-child(6),.stack > :nth-child(6){--k:5}
.group > :nth-child(n+7),.stack > :nth-child(n+7){--k:6}
@keyframes cellIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Die alte Seite blendet über der neuen aus, damit nie ein leerer Bildschirm zu sehen ist. */
.ghost{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.ghost > .col{position:absolute;margin:0;max-width:none}
.ghost *,.ghost *::before,.ghost *::after{animation:none!important;transition:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.ghost .read-bar{display:none}
.morph{position:fixed;z-index:0;pointer-events:none;transform-origin:0 0;border-radius:30px}
.col > :nth-child(2){--d:1}.col > :nth-child(3){--d:2}.col > :nth-child(4){--d:3}.col > :nth-child(5){--d:4}.col > :nth-child(6){--d:5}.col > :nth-child(n+7){--d:6}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes qIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes revealUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
@keyframes shake{30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
@keyframes pktIn{from{opacity:.25;transform:translateX(-22px) scale(.8)}to{opacity:1;transform:none}}
@keyframes leave{0%{opacity:1;transform:none}100%{opacity:.5;transform:translateY(3px) scale(.97)}}
@keyframes okFlash{0%{background:color-mix(in srgb,var(--green) 26%,transparent)}100%{background:transparent}}
@keyframes badFlash{0%{background:color-mix(in srgb,var(--red) 20%,transparent)}100%{background:transparent}}
@keyframes flyR{to{transform:translateX(70%) rotate(9deg);opacity:0}}
@keyframes flyL{to{transform:translateX(-70%) rotate(-9deg);opacity:0}}
@keyframes sheetUp{from{transform:translateY(115%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(115%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---------- Glas ---------- */
main{overflow-x:clip}
#aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#aurora i{position:absolute;display:var(--orb-show,block);width:120vmax;height:120vmax;border-radius:50%;opacity:var(--orb);will-change:transform;animation:drift 28s ease-in-out infinite alternate}
#aurora i:nth-child(1){left:-55vmax;top:-60vmax;background:radial-gradient(closest-side,var(--o1),transparent)}
#aurora i:nth-child(2){right:-65vmax;top:-30vmax;background:radial-gradient(closest-side,var(--o2),transparent);animation-duration:34s;animation-delay:-9s}
#aurora i:nth-child(3){left:-40vmax;bottom:-70vmax;background:radial-gradient(closest-side,var(--o1),transparent);animation-duration:39s;animation-delay:-17s}
#aurora i:nth-child(4){right:-60vmax;bottom:-65vmax;background:radial-gradient(closest-side,var(--o2),transparent);animation-duration:31s;animation-delay:-4s}
#aurora b{position:absolute;inset:-20%;background:radial-gradient(60% 50% at 50% 12%,var(--route,transparent),transparent);opacity:0;transition:opacity .8s}
#aurora.tinted b{opacity:var(--tint,.14)}
#aurora::after{content:"";position:absolute;inset:0;opacity:0;background:var(--pulse,transparent)}
#aurora.pulse::after{animation:pulse .45s ease-out}
#fx{position:fixed;inset:0;z-index:120;width:100%;height:100%;pointer-events:none}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(9vmax,7vmax,0) scale(1.14)}100%{transform:translate3d(-7vmax,12vmax,0) scale(.95)}}
@keyframes pulse{0%{opacity:0}30%{opacity:.09}100%{opacity:0}}

.card,.group,.hub,.tile,.mode{background:var(--surface);border:1px solid var(--glass-edge);box-shadow:var(--card-shadow)}
.card,.hub,.tile,.mode{position:relative;overflow:hidden}
.card{border-radius:22px;padding:18px}
.group{border-radius:22px}
.hub,.tile,.mode{border-radius:24px}
.card.tint{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.sidebar{background:var(--side);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-right:1px solid var(--glass-edge)}
.app-mark{background:var(--grad)}
.app-mark i{background:var(--on-grad)}
.navbar.scrolled{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-bottom-color:var(--glass-edge)}
.tabbar{border:1px solid var(--glass-edge);box-shadow:0 18px 40px -16px rgba(5,8,40,.6),inset 0 1px 0 var(--specular)}
.tab-ind{background:var(--fill)}

.kicker,.group-h,.cmp-h{text-transform:none;letter-spacing:0}
.large{font-weight:700;letter-spacing:-.022em;font-size:34px;line-height:1.1}
.mini,.stat,.mcell,.sublayer,.mnemo-box{border:1px solid var(--sep)}
.seg{background:var(--fill);border:1px solid var(--sep);border-radius:13px}
.seg-thumb{border-radius:10px;box-shadow:inset 0 1px 0 var(--specular),0 4px 10px -3px rgba(5,8,40,.35)}
.bar i,.qprog i{background:var(--accent)}

.btn{position:relative;overflow:hidden;border-radius:15px}
.btn-lg{border-radius:18px}
.btn-fill{background:var(--grad);color:var(--on-grad)}
.btn-gray,.btn-tint{border:1px solid var(--sep)}
.side-item[aria-current="page"],.cell-ic:not(.gray),.tchip[aria-pressed="true"],.slot.filled .badge,.ms.active .badge,.pkt.new{background:var(--grad);color:var(--on-grad)}
.side-item[aria-current="page"] .ic{color:inherit}
.island .idot{background:#fff;color:#111114}
.island.good .idot{background:var(--green);color:#fff}
.island.bad .idot{background:var(--red);color:#fff}
.hub,.tile,.mode,.cell,.opt,.target{transition:transform .4s var(--ease-spring),background .2s,opacity .3s}
.tile:hover,.hub:hover,.mode:hover:not([disabled]){transform:translateY(-3px)}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:currentColor;opacity:.1;pointer-events:none;animation:ripple .45s ease-out forwards}
@keyframes ripple{to{transform:scale(34);opacity:0}}
.pre,.col.entering > .pre{opacity:0;transform:translateY(18px);animation:none!important}
.rev{animation:revealUp .7s var(--ease-soft) backwards}
.layer-body{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Schichtfarben */
.lp{width:auto;height:auto;padding:0;background:transparent;border-radius:9px;display:block}
.lp .si{width:38px;height:38px;border-radius:9px;opacity:.42;transition:opacity .25s,transform .35s var(--ease-spring)}
.lp:hover .si{opacity:.75}
.lp[aria-current="page"] .si{opacity:1;transform:scale(1.06)}
.lp.learned::after{right:-2px;top:-2px;z-index:1}
.layer-pick{gap:7px}
.lhk{color:color-mix(in srgb,var(--lh) 72%,var(--label));font-weight:650}

/* Glasstapel */
.hero{display:flex;flex-direction:column;gap:16px}
.stack{position:relative;padding:12px 0 14px;display:flex;flex-direction:column}
.prow{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;height:36px;padding:0;border:0;background:transparent;color:var(--label);text-align:left;cursor:pointer;border-radius:10px}
.pw{position:relative;height:100%;animation:lift var(--loop,7s) linear infinite;animation-delay:var(--t)}
.plate{position:absolute;left:26px;top:calc(50% - 34px);width:68px;height:68px;border-radius:14px;transform:rotateX(60deg) rotateZ(45deg);pointer-events:none;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--lh) 80%,transparent),color-mix(in srgb,var(--lh) 52%,transparent));border:1px solid rgba(255,255,255,.34);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px) saturate(150%);backdrop-filter:blur(8px) saturate(150%);transition:transform .45s var(--ease-spring)}
.plate::before{content:"";position:absolute;inset:0;background:var(--lh);opacity:calc(var(--m,0) * .6)}
.plate::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:hit var(--loop,7s) linear infinite;animation-delay:var(--t)}
.prow:hover .plate,.prow:focus-visible .plate{transform:rotateX(60deg) rotateZ(45deg) scale(1.08)}
.prow:active .plate{transform:rotateX(60deg) rotateZ(45deg) scale(.92)}
.pl{display:flex;flex-direction:column;line-height:1.15;min-width:0;padding-left:6px;animation:lit var(--loop,7s) linear infinite;animation-delay:var(--t)}
.pl b{font:600 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{font-size:11.5px;color:var(--label-2)}
.pl .ic{display:inline-block;vertical-align:-2px;color:var(--green-ink)}
.signal{position:absolute;left:54px;top:24px;width:12px;height:12px;border-radius:50%;z-index:9;pointer-events:none;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:drop var(--loop,7s) linear infinite}
@keyframes drop{0%{transform:translateY(-30px) scale(.4);opacity:0}4%{transform:translateY(0) scale(1);opacity:1}70%{transform:translateY(216px) scale(1);opacity:1}78%,100%{transform:translateY(246px) scale(.3);opacity:0}}
@keyframes hit{0%{opacity:0}1.5%{opacity:.4}11%,100%{opacity:0}}
@keyframes lift{0%{transform:none}1.5%{transform:translateX(5px)}11%,100%{transform:none}}
@keyframes lit{0%{opacity:.72}1.5%{opacity:1;transform:translateX(5px)}11%{transform:none}14%,100%{opacity:1}}

/* Tagesmix */
.mix-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.combo{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#ff8a3d,#ff4f70);color:#fff;font-weight:700;font-size:13px;animation:pop .5s var(--ease-spring)}
.xp-float{position:fixed;z-index:121;pointer-events:none;font:650 15px var(--f-display);color:var(--green-ink);animation:xpUp .8s ease-out forwards}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,4px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
.mix-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.mbar{display:grid;grid-template-columns:32px minmax(0,1fr) 42px;gap:12px;align-items:center;padding:10px 16px;font-size:14px}
.mbar + .mbar{border-top:.5px solid var(--sep)}
.mbar .track{height:8px;border-radius:8px;background:var(--fill);overflow:hidden}
.mbar .track i{display:block;height:100%;border-radius:inherit;background:var(--lh);width:var(--to);animation:fillTo 1.1s var(--ease-ios) both .3s;box-shadow:0 0 10px var(--lh)}
@keyframes fillTo{from{width:var(--from)}to{width:var(--to)}}

/* Lernkarten */
.face{background:var(--face);border:1px solid var(--glass-edge);border-radius:30px}
.flash{border-radius:30px;touch-action:pan-y;will-change:transform}
.deck::before,.deck::after{border:1px solid var(--glass-edge)}
.stamp{position:absolute;top:18px;z-index:5;padding:6px 14px;border-radius:12px;font:750 17px var(--f-display);border:2.5px solid;opacity:0;pointer-events:none;transform:rotate(var(--r))}
.stamp.yes{left:18px;--r:-9deg;color:var(--green-ink);opacity:var(--yes,0)}
.stamp.no{right:18px;--r:9deg;color:var(--red-ink);opacity:var(--no,0)}

/* Themen und Module */
.mod-list{display:flex;flex-direction:column;gap:10px}
.mod-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;cursor:pointer;color:var(--label);border-radius:22px;background:var(--surface);border:1px solid var(--glass-edge);transition:transform .5s var(--ease-soft)}
.mod-card:active{transform:scale(.97);transition-duration:.1s}
.mod-card .si{width:48px;height:48px;border-radius:13px}
.mod-card b{display:block;font-size:17px;font-weight:600;line-height:1.25}
.mod-card small{display:block;font-size:13.5px;line-height:1.3;color:var(--label-2);margin-top:1px}
.mod-card .chev{color:var(--label-3)}
.mbar-line{display:flex;align-items:center;gap:9px;margin-top:8px}
.mbar-line .track{flex:1;height:5px;border-radius:5px;background:var(--fill);overflow:hidden}
.mbar-line .track i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .9s var(--ease-ios)}
.mbar-line span{font-size:12px;color:var(--label-2);font-variant-numeric:tabular-nums}
.mod-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mod-tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;text-align:left;cursor:pointer;color:var(--label);background:var(--surface);border:1px solid var(--glass-edge);min-width:0;transition:transform .5s var(--ease-soft)}
.mod-tile:active{transform:scale(.96);transition-duration:.1s}
.mod-tile:last-child:nth-child(odd){grid-column:1 / -1}
.mod-tile b{display:block;font-size:15.5px;font-weight:600;line-height:1.25}
.mod-tile small{display:block;font-size:12.5px;color:var(--label-2);margin-top:1px}
.page-hero{position:relative;z-index:1;min-width:0;border-radius:30px;color:#fff;isolation:isolate;--ph:color-mix(in srgb,var(--c) 72%,#000)}
:root[data-mono] .page-hero{--c:#636366!important}
.ph-bg{position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--ph);transform-origin:0 0}
.ph-c{position:relative;display:flex;flex-direction:column;gap:5px;padding:22px;overflow-wrap:break-word}
.ph-ic{display:block;margin-bottom:20px;line-height:0}
.ph-k{font-size:14px;font-weight:600;line-height:1.3}
.page-hero .large{font-size:clamp(26px,8.4vw,33px);line-height:1.08;color:#fff;-webkit-hyphens:auto;hyphens:auto}
.ph-l{font-size:16px;line-height:1.4;margin-top:5px}
.ph-en{font-size:15px;line-height:1.3;opacity:.92}
.ph-bar{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ph-bar .track{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}
.ph-bar i{display:block;height:100%;border-radius:inherit;background:#fff}
.ph-bar i,.mbar-line .track i,.mini .bar i{transform-origin:0 50%}
.page-hero .exam-note{color:#fff;margin-top:10px}
.page-hero .btn-fill{background:#fff;color:#000}
.page-hero .btn-tint,.page-hero .btn.done{background:rgba(255,255,255,.2);color:#fff;border:0}
.ph-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ph-row .btn{flex:1 1 auto;height:50px;border-radius:16px}
.page-hero .cta{width:100%;margin-top:16px;height:52px}
.col > .page-hero{margin-bottom:-8px}
.stack-card{padding-block:12px}
.btn{transition:transform .46s var(--ease-soft),background .25s,color .25s,opacity .25s}
.btn:active:not([disabled]){transform:scale(.96);transition-duration:.08s}
.cell{transition:background .25s,transform .46s var(--ease-soft)}
.cell:active:not(.static){transform:scale(.985);transition-duration:.08s}
.tile:active,.hub:active,.mode:active:not([disabled]){transform:scale(.97);transition-duration:.1s}
.lp:active .si{transform:scale(.9);transition-duration:.08s}
.tab{transition:color .25s}
/* Nur wo der Browser es kann: Bewegung, die direkt am Scrollen hängt. */
@supports (animation-timeline:view()){
  .shelf-card{animation:shelfDepth linear both;animation-timeline:view(inline)}
  .ph-c{animation:phScroll linear both;animation-timeline:scroll(root);animation-range:0 280px}
  .ghost .ph-c{opacity:1}
}
@keyframes shelfDepth{0%,100%{scale:.93}28%,72%{scale:1}}
@keyframes phScroll{to{opacity:.3;transform:translateY(22px)}}
:root[data-calm] .ph-c,:root[data-calm] .shelf-card{animation:none!important}
@media (prefers-reduced-motion:reduce){.ph-c,.shelf-card{animation:none!important}}
.exam-note{font-size:13.5px;line-height:1.45;color:var(--label-2)}
.src-link{text-decoration:none;min-height:44px;padding-block:8px}
.src-link .cell-title{font-size:15px;font-weight:400}
/* Begrüßung */
.welcome{display:flex;flex-direction:column;gap:14px;padding-top:9vh;min-width:0}
.large.greet{font-size:clamp(50px,15vw,84px);line-height:1;letter-spacing:-.045em;font-weight:700;padding-bottom:.08em;
  background:linear-gradient(100deg,var(--label) 30%,#ff375f 44%,#bf5af2 52%,#0a84ff 60%,#40c8e0 68%,var(--label) 82%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.first-open .large.greet{animation:greetIn 1s var(--ease-ios) both,sheenText 3.2s var(--ease-ios) both;animation-delay:var(--intro,0s)}
@keyframes greetIn{from{opacity:0;transform:translateY(22px);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheenText{from{background-position:100% 0}to{background-position:0 0}}
.welcome-sub{font-size:20px;line-height:1.3;font-weight:500;letter-spacing:-.012em;color:var(--label-2);max-width:26ch}
.first-open .welcome-sub{animation:riseIn .9s var(--ease-ios) both;animation-delay:calc(var(--intro,0s) + .18s)}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.glow{position:relative;margin-top:14px}
.first-open .glow{animation:riseIn .9s var(--ease-ios) both;animation-delay:calc(var(--intro,0s) + .32s)}
.glow-fx{position:absolute;inset:-2px;border-radius:20px;overflow:hidden;filter:blur(12px);opacity:.75;pointer-events:none}
.glow-fx i{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;background:conic-gradient(#ff375f,#bf5af2,#5e5ce6,#0a84ff,#40c8e0,#30d158,#ff9f0a,#ff375f);animation:spinFx 7s linear infinite}
@keyframes spinFx{to{transform:rotate(360deg)}}
.glow .btn{position:relative;height:58px;border-radius:18px;font-size:18px}
.welcome-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:6px;font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.first-open .welcome-meta{animation:riseIn .9s var(--ease-ios) both;animation-delay:calc(var(--intro,0s) + .46s)}
.shelf-wrap{margin:10px -16px 0;min-width:0}
.first-open .shelf-wrap{animation:shelfIn .95s var(--ease-ios) both;animation-delay:calc(var(--intro,0s) + .55s)}
.shelf{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;padding:6px 16px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf-card{flex:none;width:min(74vw,290px);height:320px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;border:0;border-radius:30px;text-align:left;color:#fff;cursor:pointer;scroll-snap-align:start;background:color-mix(in srgb,var(--c) 88%,#000);transition:transform .4s var(--ease-spring)}
@keyframes shelfIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.shelf-card:active{transform:scale(.97)}
.shelf-text{display:block}
.shelf-card b{display:block;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.022em}
.shelf-card small{display:block;margin-top:7px;font-size:14.5px;line-height:1.3;opacity:.85}
.shelf-bar{display:block;height:4px;margin-top:16px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.shelf-bar i{display:block;height:100%;border-radius:inherit;background:#fff}
@media (min-width:900px){.shelf-wrap{margin-inline:-40px}.shelf{padding-inline:40px;scroll-padding-inline:40px}}
/* Vorspann */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);pointer-events:none}
#intro.go{animation:introOut .55s cubic-bezier(.6,0,.9,.3) 1.3s forwards}
.intro-stack{display:flex;flex-direction:column;gap:7px;width:132px}
.intro-stack i{display:block;height:11px;border-radius:6px;transform-origin:left center;opacity:0}
.go .intro-stack{animation:introZoom .6s cubic-bezier(.7,0,.84,0) 1.22s forwards}
.go .intro-stack i{animation:introBar .55s var(--ease-ios) both;animation-delay:calc(var(--k) * 90ms + .1s)}
@keyframes introBar{from{opacity:0;transform:scaleX(.15) translateY(14px)}to{opacity:1;transform:none}}
@keyframes introZoom{to{transform:scale(16);opacity:0}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.idle,.idle *,.idle *::before,.idle *::after{animation-play-state:paused!important}
/* Farbige Karten wie auf der Startseite */
.mod-card,.hub.solid{--c:var(--accent);background:color-mix(in srgb,var(--c) 88%,#000);border:0;box-shadow:none;color:#fff}
:root[data-mono] .mod-card,:root[data-mono] .hub.solid{--c:#636366!important}
.mod-card .si,.hub.solid .cell-ic{background:rgba(255,255,255,.2);color:#fff}
.mod-card small,.hub.solid small{color:#fff;opacity:.88}
.mod-card .chev,.hub.solid .chev{color:#fff;opacity:.7}
.mod-card .mbar-line .track{background:rgba(255,255,255,.28)}
.mod-card .mbar-line .track i{background:#fff}
.mod-card .mbar-line span{color:#fff}
.modes .mode .big{color:color-mix(in srgb,var(--c,var(--accent)) 74%,var(--label))}
/* Schieberegler Einfach und Normal */
.easy-sw{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:20;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:46px;padding:4px;border-radius:999px;background:var(--material-strong);border:1px solid var(--glass-edge);touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;--x:1}
.easy-sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.easy-sw.drag{cursor:grabbing}
.easy-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--grad);box-shadow:0 4px 14px -6px rgba(0,0,0,.5);transform:translateX(calc(var(--x) * 100%));transition:transform .46s cubic-bezier(.3,1.14,.4,1)}
.easy-sw.drag .easy-thumb{transition:none;transform:translateX(calc(var(--x) * 100%)) scale(1.03)}
.easy-l{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;color:var(--label-2);pointer-events:none;transition:color .22s}
.easy-sw.on .easy-l:nth-of-type(2),.easy-sw:not(.on) .easy-l:nth-of-type(3){color:var(--on-grad)}
.ghost .easy-sw{position:static}
.xb{display:flex;flex-direction:column;gap:12px;min-width:0}
.xb:empty{display:none}
.ez-tag{display:block;margin-bottom:6px;font-size:13px;font-weight:650;color:color-mix(in srgb,var(--c,var(--accent)) 74%,var(--label))}
.ez-lead{font-size:19px!important;font-weight:600;line-height:1.35!important;letter-spacing:-.01em}
.ez-pic{background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--surface))}
.ez-next{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:22px;border:1px dashed var(--sep);font-size:15px;line-height:1.4;color:var(--label-2);text-align:center}
.ez-next .btn{width:100%;height:48px;border-radius:15px}
/* Weitere weiche Abläufe */
.ph-c > :nth-child(2),.llist li:nth-child(2),.lrow:nth-child(2){--k:1}
.ph-c > :nth-child(3),.llist li:nth-child(3),.lrow:nth-child(3){--k:2}
.ph-c > :nth-child(4),.llist li:nth-child(4),.lrow:nth-child(4){--k:3}
.ph-c > :nth-child(5),.llist li:nth-child(5),.lrow:nth-child(5){--k:4}
.ph-c > :nth-child(n+6),.llist li:nth-child(n+6),.lrow:nth-child(n+6){--k:5}
.col.entering .ph-c > *{animation:cellIn .55s var(--ease-soft) backwards;animation-delay:calc(var(--k,0) * 38ms + 110ms)}
.col.entering .llist li,.col.entering .lrow,.rev .llist li,.rev .lrow,.xb-in .llist li,.xb-in .lrow{animation:cellIn .5s var(--ease-soft) backwards;animation-delay:calc(var(--k,0) * 30ms + 60ms)}
.opt.ok{animation:optOk .5s var(--ease-soft)}
@keyframes optOk{from{transform:scale(.975)}to{transform:none}}
.ghost .lrow,.ghost .llist li{animation:none!important}
/* Lernseite */
.read-bar{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));height:2px;z-index:26;background:var(--c);transform:scaleX(var(--p,0));transform-origin:left center;pointer-events:none}
.lesson{display:flex;flex-direction:column;gap:12px;min-width:0}
.lb{overflow-wrap:break-word;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--glass-edge);min-width:0}
.lb h2{font-size:20px;font-weight:700;letter-spacing:-.016em;line-height:1.2;margin-bottom:10px}
.lb p{font-size:16.5px;line-height:1.5}
.lb > * + p,.lb > * + .llist,.lb > * + .lrows,.lb > * + pre,.lb > * + .tscroll{margin-top:10px}
.lb h2 + *{margin-top:0}
.llist{list-style:none;margin:0;padding:0}
.llist li{position:relative;padding:9px 0 9px 18px;font-size:16px;line-height:1.4}
.llist li + li{border-top:1px solid var(--sep)}
.llist li::before{content:"";position:absolute;left:1px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.llist li:first-child{padding-top:2px}
.llist li:first-child::before{top:10px}
.llist li:last-child{padding-bottom:0}
.lrows{display:flex;flex-direction:column}
.lrow{padding:10px 0}
.lrow + .lrow{border-top:1px solid var(--sep)}
.lrow:first-child{padding-top:0}
.lrow:last-child{padding-bottom:0}
.lrow > b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.lrow dl{margin:5px 0 0;display:grid;gap:3px}
.lrow dl div{display:flex;flex-wrap:wrap;column-gap:10px;font-size:14.5px;line-height:1.35}
.lrow dt{flex:0 0 34%;color:var(--label-2)}
.lrow dd{flex:1 1 55%;min-width:0;margin:0}
.lpairs .lrow{display:flex;flex-wrap:wrap;column-gap:12px;align-items:baseline}
.lpairs .lrow > b{flex:0 0 36%;font-size:15.5px}
.lpairs .lrow > span{flex:1 1 52%;min-width:0;font-size:15.5px;line-height:1.35;color:var(--label-2)}
.lpairs .lhead{padding:0 0 8px;font-size:13px;font-weight:600;color:var(--label-2)}
.lpairs .lhead > span{flex:1 1 52%;min-width:0;font-size:13px}
.lpairs .lhead > span:first-child{flex:0 0 36%}
.lpairs .lhead + .lrow{border-top:1px solid var(--sep);padding-top:10px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.tscroll table{min-width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.3}
.tscroll th{text-align:left;font-weight:600;color:var(--label-2);padding:0 12px 8px 0;white-space:nowrap}
.tscroll td{padding:8px 12px 8px 0;border-top:1px solid var(--sep);white-space:nowrap;font-variant-numeric:tabular-nums}
.tscroll th:last-child,.tscroll td:last-child{padding-right:0}
.tscroll.fit table{width:100%}
.tscroll.fit td:first-child{font-weight:600}
.lb pre{margin-inline:0;padding:13px 14px;border-radius:14px;background:var(--fill-2);font:500 13px/1.55 var(--f-mono);overflow-x:auto;white-space:pre}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:15px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;background:var(--surface);border:1px solid var(--glass-edge)}
.note.warn .ic{color:var(--red-ink)}
.note.tip .ic{color:#ff9f0a}
.lesson-foot{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lesson-foot .btn{width:100%;height:50px;border-radius:16px}
.lesson-count{font-size:13px;color:var(--label-2);text-align:center}

/* Suche und Probeprüfung */
.search-box{display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border-radius:13px;background:var(--fill);color:var(--label-2)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--label);font:inherit;font-size:17px}
.result-type{color:var(--label-2)}
.pz-time{font-variant-numeric:tabular-nums;color:var(--label-2);font-weight:600}
.opt.chosen{background:var(--accent-tint)}
.pass{font-size:15px;font-weight:600}
.pass.ok{color:var(--green-ink)}
.pass.no{color:var(--red-ink)}

/* Einstellungen im Stil der iOS-App */
main{zoom:var(--zoom,1)}
.switch[aria-checked="true"]{background:#34c759}
.nb-round{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%;background:var(--surface);border:1px solid var(--glass-edge);color:var(--label);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);transition:transform .35s var(--ease-spring)}
.nb-round:active{transform:scale(.88);opacity:1}
.nb-round .ic{transition:transform .6s var(--ease-spring)}
.nb-round:hover .ic{transform:rotate(45deg)}
.set{gap:10px}
.set-sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.set-sec + .set-sec{margin-top:16px}
.set-sec .group-h{padding:0 16px;font-size:13px}
.cell.sc{min-height:50px;padding:9px 14px;gap:12px;--inset:56px;font-size:17px}
.cell.sc.plain{--inset:16px}
.cell.sc .cell-title{font-size:17px;font-weight:400;line-height:1.25}
.cell.sc .chev{flex:none;color:var(--label-3)}
.cell.sc.danger{color:var(--red-ink);justify-content:center}
.cell.sc.link{color:var(--accent)}
.si{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--c,#8e8e93)}

async function flush() {
  if (!dbRef) return;

  writing = true;
  try { await dbRef.set(clone(S)); setSync("cloud"); }
  catch (e) {
    if (e && e.code === "unavailable") setTimeout(flush, 1500 + Math.random() * 1500);

  }
  writing = false;
  if (pendingWrite) { pendingWrite = false; flush(); }
}
async function connectDb() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { setSync("local"); return; }
    const id = await user.id();
    if (!id) { setSync("local"); return; }
    const ref = db.collection("data/users/" + id).doc("osi");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), 10000))]);
    dbRef = ref;
    if (snap.exists) {
      const remote = clone(snap.data() || {});
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(DEFAULT(), remote); writeLocal(); refreshPassive(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flush();

}

const HUE = {1:"#ff9f0a", 2:"#30d158", 3:"#40c8e0", 4:"#0a84ff", 5:"#5e5ce6", 6:"#bf5af2", 7:"#ff375f"};

const streakNow = () => S.streak.last >= today() - 1 ? S.streak.n : 0;

function grade(id, ok, xp) {
  const d = today(), rec = S.srs[id] || {b:0, d:0};
  const b = ok ? Math.min(SRS_DAYS.length - 1, rec.b + 1) : 0;
  S.srs[id] = {b, d:d + SRS_DAYS[b]};
  countDay(xp);
}
function countDay(xp) {
  const d = today();
  if (S.day.d !== d) S.day = {d, n:0};
  S.day.n++;
  if (S.streak.last !== d) S.streak = {n:S.streak.last === d - 1 ? S.streak.n + 1 : 1, last:d};
  S.xp += xp;
}
const ITEMS = MODS.flatMap(m => [...m.cards.map(c => ({k:"card", id:c.id, L:c.L || 0, m:m.id})), ...m.questions.map(q => ({k:"q", id:q.id, L:q.L || 0, m:m.id}))]);
const allItems = () => ITEMS;
const isDue = it => S.srs[it.id] && S.srs[it.id].d <= today();
const dueCount = () => ITEMS.filter(isDue).length;
const share = items => items.length ? items.reduce((sum, it) => sum + (S.srs[it.id] ? S.srs[it.id].b : 0), 0) / (items.length * (SRS_DAYS.length - 1)) : 0;
const mastery = n => share(ITEMS.filter(it => it.m === "osi" && it.L === n));
const modMastery = id => share(ITEMS.filter(it => it.m === id));
/* Fortschritt eines Registers: 40 % gelesene Lernseiten, 60 % gefestigte Karten und Fragen. */
function modProgress(id) {
  const m = MOD[id];
  const read = m.osi ? LAYERS.filter(l => S.learned[l.n]).length / 7 : m.units.filter(u => S.unitsDone[`${id}.${u.id}`]).length / m.units.length;
  return Math.round((read * .4 + modMastery(id) * .6) * 100);
}
const overallProgress = () => Math.round(MODS.reduce((sum, m) => sum + modProgress(m.id), 0) / MODS.length);
/* Zuerst Fälliges, dann Neues aus den schwächsten Schichten (Karte und Frage im Wechsel), sonst das Unsicherste. */
function buildMix(layer, size = CFG.round, modId = "") {
  let all = ITEMS.filter(it => (!layer || (it.m === "osi" && it.L === layer)) && (!modId || it.m === modId));
  const only = all.filter(it => CFG.content === "mix" || it.k === CFG.content);
  if (only.length) all = only;
  const box = it => S.srs[it.id] ? S.srs[it.id].b : 0;
  const due = shuffle(all.filter(isDue)).sort((a, b) => box(a) - box(b));
  const weak = Object.fromEntries(MODS.map(m => [m.id, modMastery(m.id)]));
  const newOf = k => shuffle(all.filter(it => it.k === k && !S.srs[it.id])).sort((a, b) => weak[a.m] - weak[b.m]);
  const cards = newOf("card"), qs = newOf("q"), fresh = [];
  while (cards.length || qs.length) { if (cards.length) fresh.push(cards.shift()); if (qs.length) fresh.push(qs.shift()); }
  const rest = shuffle(all.filter(it => S.srs[it.id] && !isDue(it))).sort((a, b) => box(a) - box(b));
  return [...due, ...fresh, ...rest].slice(0, size).map(it => it.k === "q" ? {...it, opts:arrange(Q_BY_ID[it.id].o)} : it);
}

/* ---------------- Rechentraining ---------------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = a => a[rnd(0, a.length - 1)];
const num = n => String(n).replace(".", ",");
const DRILLS = {
  subnet:{title:"Subnetting", gen() {
    const p = rnd(25, 30), size = 2 ** (32 - p), o = rnd(1, 254), net = Math.floor(o / size) * size, base = `192.168.${rnd(0, 40)}`;
    const ip = `${base}.${o}/${p}`, mask = `255.255.255.${256 - size}`, hosts = size - 2;
    const blockE = `Blockgröße 256 - ${256 - size} = ${size}. Der Block geht von .${net} bis .${net + size - 1}.`;
    const kind = pickOne(["net", "bc", "hosts", "mask"]);
    if (kind === "net") return {q:`Wie lautet die Netzadresse von ${ip}?`, r:`${base}.${net}`, w:[`${base}.${o}`, `${base}.${net + size - 1}`, `${base}.${(net + size) % 256}`, `${base}.${Math.max(0, net - size)}`, `${base}.0`], e:blockE};
    if (kind === "bc") return {q:`Wie lautet die Broadcastadresse von ${ip}?`, r:`${base}.${net + size - 1}`, w:[`${base}.${net}`, `${base}.255`, `${base}.${net + size - 2}`, `${base}.${(net + size) % 256}`], e:blockE};
    if (kind === "hosts") return {q:`Wie viele Hosts sind in einem /${p}-Netz nutzbar?`, r:String(hosts), w:[String(size), String(hosts - 2), String(size * 2 - 2), String(size / 2 > 2 ? size / 2 - 2 : size + 2)], e:`${32 - p} Hostbits: 2 hoch ${32 - p} sind ${size}, minus Netz und Broadcast.`};
    return {q:`Welche Subnetzmaske gehört zu /${p}?`, r:mask, w:[25, 26, 27, 28, 29, 30].filter(x => x !== p).map(x => `255.255.255.${256 - 2 ** (32 - x)}`), e:`Von den 8 Bit im letzten Oktett sind ${p - 24} gesetzt. Das ergibt ${256 - size}.`};
  }},
  binary:{title:"Binär und Hex", gen() {
    const n = rnd(1, 255), bin = n.toString(2).padStart(8, "0"), hex = n.toString(16).toUpperCase().padStart(2, "0");
    const near = [n + 1, n - 1, n + 16, n ^ 1, n ^ 16, n ^ 128].filter(x => x >= 0 && x <= 255 && x !== n);
    const kind = pickOne(["d2b", "b2d", "d2h", "h2d"]);
    if (kind === "d2b") return {q:`Wie lautet ${n} im Binärsystem?`, r:bin, w:near.map(x => x.toString(2).padStart(8, "0")), e:`Die Stellen stehen für 128, 64, 32, 16, 8, 4, 2 und 1.`};
    if (kind === "b2d") return {q:`Welchen Dezimalwert hat ${bin}?`, r:String(n), w:near.map(String), e:`Addiere die gesetzten Stellen: 128, 64, 32, 16, 8, 4, 2, 1.`};
    if (kind === "d2h") return {q:`Wie lautet ${n} hexadezimal?`, r:hex, w:near.map(x => x.toString(16).toUpperCase().padStart(2, "0")), e:`${n} ÷ 16 = ${Math.floor(n / 16)} Rest ${n % 16}.`};
    return {q:`Welchen Dezimalwert hat ${hex} (hexadezimal)?`, r:String(n), w:near.map(String), e:`${parseInt(hex[0], 16)} × 16 + ${parseInt(hex[1], 16)} = ${n}.`};
  }},
  raid:{title:"RAID", gen() {
    const lvl = pickOne([0, 1, 5, 6, 10]), size = pickOne([1, 2, 4, 8]), n = lvl === 10 ? pickOne([4, 6, 8]) : lvl === 6 ? rnd(4, 8) : lvl === 1 ? 2 : rnd(3, 8);
    const cap = {0:n * size, 1:size, 5:(n - 1) * size, 6:(n - 2) * size, 10:n / 2 * size}[lvl];
    const f = {0:"n × Größe", 1:"eine Platte", 5:"(n - 1) × Größe", 6:"(n - 2) × Größe", 10:"n ÷ 2 × Größe"}[lvl];
    return {q:`Wie viel Speicher ist bei RAID ${lvl} aus ${n} Platten mit je ${size} TB nutzbar?`, r:`${cap} TB`, w:[n * size, (n - 1) * size, (n - 2) * size, n / 2 * size, size, cap + size, cap * 2, cap * 3, size / 2].filter(x => x > 0).map(x => `${num(x)} TB`), e:`RAID ${lvl}: ${f}.`};
  }},
  units:{title:"Datenraten", gen() {
    const mb = pickOne([100, 250, 500, 1000, 2000, 5000]), rate = pickOne([10, 50, 100, 200, 500, 1000]), sec = mb * 8 / rate;
    const t = s => `${num(+s.toFixed(1))} s`;
    return {q:`Wie lange dauert es, ${mb} MB bei ${rate} Mbit/s zu übertragen?`, r:t(sec), w:[t(mb / rate), t(sec * 2), t(sec / 2), t(sec * 8), t(sec + 10)], e:`${mb} MB × 8 = ${mb * 8} Mbit. ${mb * 8} ÷ ${rate} = ${num(+sec.toFixed(1))} Sekunden.`};
  }}
};
const dr = {mod:"", kind:"", cur:null, opts:[], picked:null, right:0, total:0};

  const c = DRILLS[dr.kind].gen(), seen = new Set([c.r]), w = [];

/* ---------------- Kapselung ---------------- */
function vKapselung() {
  enc.prev = [];
  actHandler = (act, el) => {
    const last = ENCAP[enc.mode].length - 1, before = enc.i;
    if (act === "mode") { if (el.dataset.v === enc.mode) return; stopTimers(); enc.mode = el.dataset.v; enc.i = 0; enc.prev = []; haptic("select"); }
    if (act === "prev") { stopTimers(); enc.i = Math.max(0, enc.i - 1); }
    if (act === "next") { stopTimers(); enc.i = Math.min(last, enc.i + 1); }
    if (act === "jump") { stopTimers(); enc.i = +el.dataset.k; }
    if (act === "play") {
      haptic("medium");
      if (enc.playing) stopTimers();
      else {
        if (enc.i >= last) { enc.i = 0; enc.prev = []; }
        enc.playing = true;
        encTimer = setInterval(tickEnc, 3200);
      }
    }
    if (act !== "mode" && enc.i !== before) haptic("select");
    const hadFocus = el && el === document.activeElement;
    drawEnc(act === "mode" || enc.i !== before);
    if (hadFocus && ["prev", "next", "play"].includes(act)) {
      const b = view.querySelector(`[data-act="${act}"]:not([disabled])`) || view.querySelector('[data-act="play"]');
      if (b) b.focus({preventScroll:true});
    }
  };
  keyHandler = e => {
    if (e.key === "ArrowRight") { e.preventDefault(); actHandler("next"); }
    if (e.key === "ArrowLeft") { e.preventDefault(); actHandler("prev"); }
    if (e.key === " ") { e.preventDefault(); actHandler("play"); }
  };
  drawEnc(false);
}
function tickEnc() {
  const last = ENCAP[enc.mode].length - 1;
  if (enc.i < last) enc.i++;
  if (enc.i >= last) { clearInterval(encTimer); encTimer = null; enc.playing = false; }
  haptic("select");
  drawEnc(true);
}
const pduAt = n => n >= 5 ? "Daten" : n === 4 ? "Segment" : n === 3 ? "Paket" : n === 2 ? "Frame" : "Bits";
function wave(bits) {
  const w = 10, hi = 5, lo = 29;
  let x = 0, d = `M0 ${bits[0] === "1" ? hi : lo}`;
  for (const b of bits) d += ` V${b === "1" ? hi : lo} H${x += w}`;
  return `<svg class="wave" viewBox="0 0 ${bits.length * w} 34" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

  }
  return `<div class="packet">${st.blocks.map(b => {
    const d = BLK[b], leaving = st.drop && st.drop.includes(b), isFresh = fresh.includes(b);

  }).join("")}</div>`;
}
