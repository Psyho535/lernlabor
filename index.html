/* ---------------- Quiz ---------------- */
let qz = {phase:"intro"};
function arrange(o) {
  const items = o.map((t, i) => ({t, ok:i === 0}));
  const num = s => { const m = s.match(/\d+/); return m ? +m[0] : 0; };
  const sortable = items.every(x => /^(Schicht )?\d/.test(x.t));
  return sortable ? items.sort((a, b) => num(a.t) - num(b.t) || a.t.localeCompare(b.t)) : shuffle(items);
}
function startQuiz(mode) {
  let pool;
  const all = curMod.questions;
  if (mode === "quick") pool = shuffle(all).slice(0, 10);
  else if (mode === "big") pool = shuffle(all).slice(0, 25);
  else pool = shuffle(all.filter(q => S.wrong.includes(q.id)));
  if (!pool.length) { drawQuiz(); return; }
  haptic("medium");
  qz = {phase:"q", mod:curMod.id, mode, list:pool.map(q => ({...q, opts:arrange(q.o)})), i:0, answers:[], picked:null, fresh:true};
  drawQuiz();
  window.scrollTo(0, 0);
}
function pick(k) {
  if (qz.picked != null) return;
  const q = qz.list[qz.i], opt = q.opts[k];
  if (!opt) return;
  qz.picked = k; qz.fresh = false;
  qz.answers.push({id:q.id, ok:opt.ok, yours:opt.t, right:q.opts.find(x => x.ok).t});
  haptic(opt.ok ? "success" : "error");
  grade(q.id, opt.ok, opt.ok ? 10 : 1);
  tone(opt.ok);
  drawQuiz();
  pulse(opt.ok ? "var(--green)" : "var(--red)");
  if (opt.ok) floatXP($(".opt.ok"), "+10 XP");
  if (opt.ok && CFG.auto) setTimeout(() => { if (qz.phase === "q" && qz.list[qz.i] === q && qz.picked === k && parseHash().view === "quiz") { nextQ(); } }, 1100);
  const nb = $("#nextQ"); if (nb) nb.focus({preventScroll:true});
}
function nextQ() {
  if (qz.picked == null) return;
  haptic("light");
  qz.i++; qz.picked = null; qz.fresh = true;
  if (qz.i >= qz.list.length) finishQuiz();
  drawQuiz();
  window.scrollTo(0, 0);
}
function finishQuiz() {
  const right = qz.answers.filter(a => a.ok).length, p = pct(right, qz.answers.length);
  const st = qs();
  st.quizRuns++;
  st.quizHist = [...st.quizHist, p].slice(-12);
  if (qz.mode !== "wrong") st.quizBest = Math.max(st.quizBest || 0, p);
  const wrong = new Set(S.wrong);
  qz.answers.forEach(a => { if (a.ok) wrong.delete(a.id); else wrong.add(a.id); });
  S.wrong = [...wrong];
  save();
  qz.phase = "result"; qz.right = right; qz.pct = p;
  setTimeout(() => { haptic(p >= 80 ? "success" : "medium"); if (p >= 80) celebrate(); }, 300);
}
function vQuiz() {
  if (qz.phase !== "q" || qz.mod !== curMod.id) qz = {phase:"intro", mod:curMod.id};
  actHandler = (act, el) => {
    if (act === "start") startQuiz(el.dataset.m);
    if (act === "pick") pick(+el.dataset.k);
    if (act === "next") nextQ();
    if (act === "intro") { qz = {phase:"intro"}; haptic("light"); drawQuiz(); window.scrollTo(0, 0); }
    if (act === "quit") sheet({title:"Quiz beenden?", msg:"Diese Runde wird nicht gewertet.", action:"Quiz beenden", onConfirm:() => { qz = {phase:"intro"}; drawQuiz(); window.scrollTo(0, 0); }});
  };
  keyHandler = e => {
    if (qz.phase !== "q") return;
    if (qz.picked == null) {
      const k = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
      if (k >= 0) { e.preventDefault(); pick(k); }
    } else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); nextQ(); }
  };
  if (quizAutostart) { const m = quizAutostart; quizAutostart = null; startQuiz(m); return; }
  drawQuiz();
}
function drawQuiz() {
  const wrongN = modWrong().length;
  if (qz.phase === "intro") {
    setNav();
    paint(`
    ${pageHero(curMod.color, {kicker:curMod.title, title:"Quiz", lede:"Nach jeder Antwort erfährst du, warum sie richtig oder falsch ist."})}

    </section>

    <p class="group-f">Mit den Tasten <span class="kbd">1</span>–<span class="kbd">4</span> antwortest du, mit <span class="kbd">Enter</span> geht es weiter.</p>`);

  }

    const wrongs = qz.answers.filter(a => !a.ok);
    const msg = qz.pct === 100 ? "Perfekt, alles richtig." : qz.pct >= 80 ? "Stark, das sitzt schon richtig gut." : qz.pct >= 50 ? "Solide Basis. Schau dir die Fehler noch einmal an." : "Dranbleiben. Lies die Schichten nach und versuch es noch einmal.";

  setNav({left:`<button class="nb-btn" data-act="quit">Beenden</button>`, title:`Frage ${qz.i + 1} von ${qz.list.length}`, right:`<span class="nb-btn tnum" style="cursor:default;color:var(--label-2)">${qz.answers.filter(a => a.ok).length} ${icon("check", 16)}</span>`});
  paint(`
  <div class="qprog" aria-hidden="true"><i style="width:${pct(qz.answers.length, qz.list.length)}%"></i></div>
  <section class="qcard${qz.fresh ? qIn() : ""}">
    <div class="kicker">${qWhere(q)}</div>
    <h2 class="qtext">${q.q}</h2>
    <div class="group">${q.opts.map((o, k) => {
      const cls = answered ? (o.ok ? "ok" : k === qz.picked ? "no" : "dim") : "";
      const mark = answered && o.ok ? icon("check", 20, "mark") : answered && k === qz.picked ? icon("x", 20, "mark") : "<span></span>";
      return `<button class="opt ${cls}" data-act="pick" data-k="${k}" ${answered ? "disabled" : ""}><span class="key">${"ABCD"[k]}</span><span>${o.t}</span>${mark}</button>`;
    }).join("")}</div>
    ${answered ? `<div class="explain ${ok ? "good" : "bad"}" role="status">${icon(ok ? "check" : "bulb", 20)}<div><b>${ok ? "Richtig" : "Nicht ganz"}</b>${q.e}</div></div>
      <button class="btn btn-fill btn-lg" id="nextQ" data-act="next">${qz.i + 1 < qz.list.length ? "Nächste Frage" : "Ergebnis ansehen"}</button>` : ""}
  </section>`, {anim:false});
}

/* ---------------- Lernkarten ---------------- */
const kc = {mod:"osi", filter:"alle", open:false, deck:[], i:0, flipped:false, done:false, busy:false};
function buildDeck() {
  kc.deck = shuffle(curMod.cards.filter(c => (kc.filter === "alle" || c.tag === kc.filter) && (!kc.open || !S.known.includes(c.id))).map(c => c.id));
  kc.i = 0; kc.flipped = false; kc.busy = false; kc.done = kc.deck.length === 0;
}
function decideCard(act) {
  const id = kc.deck[kc.i];
  grade(id, act === "know", act === "know" ? 5 : 1);
  if (act === "know") { if (!S.known.includes(id)) S.known.push(id); }
  else { S.known = S.known.filter(x => x !== id); if (kc.deck.length - kc.i > 1) kc.deck.splice(Math.min(kc.deck.length, kc.i + 4), 0, id); }
  save();
  kc.i++; kc.flipped = false; kc.busy = false;
  if (kc.i >= kc.deck.length) { kc.done = true; haptic("success"); }
  drawCards();
}
function vKarten() {
  if (kc.mod !== curMod.id) { kc.mod = curMod.id; kc.filter = "alle"; kc.open = false; kc.deck = []; kc.done = false; }
  if (!kc.deck.length && !kc.done) buildDeck();
  kc.busy = false;
  actHandler = (act, el) => {
    if (act === "flip") { kc.flipped = !kc.flipped; haptic("light"); const f = $(".flash"); if (f) f.classList.toggle("flipped", kc.flipped); return; }
    if (act === "know" || act === "again") {
      if (kc.busy || kc.done) return;
      kc.busy = true;
      haptic(act === "know" ? "success" : "medium");
      const f = $(".flash");
      if (f && !reduced()) { f.classList.add(act === "know" ? "fly-right" : "fly-left"); setTimeout(() => decideCard(act), 240); }
      else decideCard(act);
      return;
    }
    if (act === "filter") { if (kc.filter === el.dataset.v) return; kc.filter = el.dataset.v; haptic("select"); buildDeck(); }
    if (act === "open") {
      kc.open = !kc.open; el.setAttribute("aria-checked", String(kc.open)); haptic("light");
      setTimeout(() => { buildDeck(); drawCards(); }, reduced() ? 0 : 260);
      return;
    }
    if (act === "shuffle" || act === "restart") { haptic("medium"); buildDeck(); }
    if (act === "openonly") { kc.open = true; haptic("light"); buildDeck(); }
    if (act === "showall") { kc.open = false; haptic("light"); buildDeck(); }
    drawCards();
  };
  keyHandler = e => {
    if (kc.done) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); actHandler("flip"); }
    else if (e.key === "ArrowRight" || e.key.toLowerCase() === "g") actHandler("know");
    else if (e.key === "ArrowLeft" || e.key.toLowerCase() === "n") actHandler("again");
  };
  drawCards();
}
function drawCards() {
  const inFilter = curMod.cards.filter(c => kc.filter === "alle" || c.tag === kc.filter);
  const knownIn = inFilter.filter(c => S.known.includes(c.id)).length;
  let stage;
  if (kc.done) {
    const allKnown = knownIn === inFilter.length;
    stage = `<div class="card done-card">${ring(pct(knownIn, inFilter.length), 112, 11, "gewusst")}
      <h2>${allKnown ? "Alles gewusst" : "Stapel geschafft"}</h2>
      <p class="muted">${knownIn} von ${inFilter.length} Karten in dieser Auswahl gewusst.</p>
      <div class="row" style="justify-content:center">
        <button class="btn btn-fill" data-act="restart">${icon("shuffle", 18)} Neu mischen</button>
        ${!kc.open && !allKnown ? `<button class="btn btn-tint" data-act="openonly">Nur offene Karten</button>` : ""}
        ${kc.open ? `<button class="btn btn-tint" data-act="showall">Alle Karten</button>` : ""}
      </div></div>`;
  } else {
    const c = CARD_BY_ID[kc.deck[kc.i]];
    const tagTxt = (c.tag === "schichten" || c.tag === "pdu") && c.L ? `Schicht ${c.L}` : c.u ? unitOf(curMod, c.u).title : TAG_LABEL[c.tag];
    stage = `<div class="deck"><div class="flash${kc.flipped ? " flipped" : ""}" data-act="flip" role="button" tabindex="0" aria-label="Karte umdrehen">${STAMPS}
        <div class="flash-inner">
          <div class="face front"><span class="chip accent">${tagTxt}</span><div class="face-q">${c.f}</div><span class="hint">Tippen zum Umdrehen</span></div>
          <div class="face answer"><span class="kicker">Antwort</span><div class="face-a">${c.b}</div></div>
        </div></div></div>
      <div class="card-actions">
        <button class="btn btn-gray btn-lg" data-act="again">Nochmal</button>
        <button class="btn btn-fill btn-lg" data-act="know">Gewusst</button>
      </div>
      <div class="card-meta"><span class="tnum">Karte ${kc.i + 1} von ${kc.deck.length}</span><span class="tnum">${knownIn} von ${inFilter.length} gewusst</span></div>`;
  }
  setNav({right:kc.done ? "" : `<button class="nb-btn" data-act="shuffle" aria-label="Mischen">${icon("shuffle", 20)}</button>`});
  paint(`
  ${pageHero(curMod.color, {kicker:curMod.title, title:"Lernkarten", lede:"Tippe zum Umdrehen. Wische nach rechts, wenn du es wusstest, und nach links, wenn sie wiederkommen soll."})}
  ${curMod.osi ? seg("kfilter", [["alle", "Alle"], ["schichten", "Schichten"], ["pdu", "PDU"], ["begriffe", "Begriffe"], ["ports", "Ports"]], kc.filter, "filter") : ""}
  <div class="group"><div class="toggle-cell"><span>Nur offene Karten</span><button class="switch" role="switch" aria-label="Nur offene Karten" aria-checked="${kc.open}" data-act="open"></button></div></div>
  <div class="stage">${stage}</div>`, {anim:kc.done});
  if (kc.done) { if (knownIn === inFilter.length) celebrate(); }
  else bindSwipe(act => actHandler(act));
}

/* ---------------- Tagesmix ---------------- */
const mix = {phase:"idle", layer:0, mod:"", onlyWrong:false, list:[], i:0, picked:null, flipped:false, busy:false, firstRight:0, firsts:0, xp:0, combo:0, best:0, retried:{}, before:{}};
function startMix() {
  let list = buildMix(mix.layer, CFG.round, mix.mod);
  if (mix.onlyWrong) {
    list = shuffle(S.wrong.filter(id => Q_BY_ID[id])).slice(0, Math.max(CFG.round, 10)).map(id => ({k:"q", id, L:Q_BY_ID[id].L || 0, m:Q_BY_ID[id].m, opts:arrange(Q_BY_ID[id].o)}));
    if (!list.length) list = buildMix(0, CFG.round);
  }
  const before = {};
  MODS.forEach(m => { before[m.id] = modMastery(m.id); });
  Object.assign(mix, {phase:"run", layer:0, mod:"", onlyWrong:false, list, i:0, picked:null, flipped:false, busy:false, firstRight:0, firsts:0, xp:0, combo:0, best:0, retried:{}, before});
  haptic("medium");
}
function scoreItem(it, ok) {
  if (!it.retry) { mix.firsts++; if (ok) mix.firstRight++; }
  mix.combo = ok ? mix.combo + 1 : 0;
  mix.best = Math.max(mix.best, mix.combo);
  const base = it.k === "q" ? 10 : 5;
  const xp = ok ? base + Math.min(10, Math.max(0, mix.combo - 1) * 2) : 1;
  mix.xp += xp;
  grade(it.id, ok, xp);
  if (it.k === "card") { if (ok) { if (!S.known.includes(it.id)) S.known.push(it.id); } else S.known = S.known.filter(x => x !== it.id); }
  else { const w = new Set(S.wrong); if (ok) w.delete(it.id); else w.add(it.id); S.wrong = [...w]; }
  // Falsches kommt in dieser Runde noch einmal, einmalig und ein paar Aufgaben später.
  if (!ok && !mix.retried[it.id]) { mix.retried[it.id] = true; mix.list.splice(Math.min(mix.list.length, mix.i + 4), 0, {...it, retry:true}); }
  save();
  return xp;
}
function mixAnswer(k) {
  const it = mix.list[mix.i];
  if (mix.picked != null || it.k !== "q" || !it.opts[k]) return;
  mix.picked = k;
  const ok = it.opts[k].ok, xp = scoreItem(it, ok);
  haptic(ok ? "success" : "error");
  tone(ok);
  drawMix();
  pulse(ok ? "var(--green)" : "var(--red)");
  if (ok) floatXP($(".opt.ok"), `+${xp} XP`);
  const nb = $("#nextMix"); if (nb) nb.focus({preventScroll:true});
  if (ok && CFG.auto) setTimeout(() => { if (mix.phase === "run" && mix.list[mix.i] === it && mix.picked === k && parseHash().view === "heute") mixNext(); }, 1100);
}
function mixCard(act) {
  if (mix.busy) return;
  const it = mix.list[mix.i], ok = act === "know";
  mix.busy = true;
  const f = $(".flash"), xp = scoreItem(it, ok);
  haptic(ok ? "success" : "medium");
  tone(ok);
  pulse(ok ? "var(--green)" : "var(--red)");
  if (ok) floatXP(f, `+${xp} XP`);
  if (f && !reduced()) { f.classList.add(ok ? "fly-right" : "fly-left"); setTimeout(mixNext, 240); }
  else mixNext();
}
function mixNext() {
  mix.i++; mix.picked = null; mix.flipped = false; mix.busy = false;
  if (mix.i >= mix.list.length) {
    mix.phase = "done";
    setTimeout(() => { haptic("success"); if (mix.firstRight / Math.max(1, mix.firsts) >= .6) celebrate(); }, 350);
  }
  drawMix();
  window.scrollTo(0, 0);
}
function vHeute() {
  startMix();
  actHandler = (act, el) => {
    if (act === "pick") mixAnswer(+el.dataset.k);
    if (act === "next") { haptic("light"); mixNext(); }
    if (act === "flip") { mix.flipped = !mix.flipped; haptic("light"); const f = $(".flash"); if (f) f.classList.toggle("flipped", mix.flipped); }
    if (act === "know" || act === "again") mixCard(act);
    if (act === "again-round") { startMix(); drawMix(); window.scrollTo(0, 0); }
    if (act === "weak") { mix.mod = el.dataset.n; startMix(); drawMix(); window.scrollTo(0, 0); }
  };
  keyHandler = e => {
    if (mix.phase !== "run") return;
    const it = mix.list[mix.i];
    if (it.k === "q") {
      if (mix.picked == null) { const k = "1234".indexOf(e.key); if (k >= 0) { e.preventDefault(); mixAnswer(k); } }
      else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); mixNext(); }
    } else if (e.key === " " || e.key === "Enter") { e.preventDefault(); actHandler("flip"); }
    else if (e.key === "ArrowRight") actHandler("know");
    else if (e.key === "ArrowLeft") actHandler("again");
  };
  drawMix();

/* ---------------- Übungen ---------------- */
const ub = {tab:"zuordnen"};
let as = null, od = null;
function newAssign() {
  const picks = [];
  for (let n = 1; n <= 7; n++) { const c = SORT_POOL.filter(x => x.L === n); picks.push(c[Math.floor(Math.random() * c.length)]); }
  const rest = shuffle(SORT_POOL.filter(x => !picks.includes(x))).slice(0, 3);
  as = {items:shuffle([...picks, ...rest]).map((x, k) => ({...x, k, placed:false})), sel:null, errors:0, done:false, flash:null, lastK:null};
}
function placeAt(k, n) {
  if (!as || as.done) return;
  const it = as.items.find(x => x.k === k);
  if (!it || it.placed) return;
  if (it.L === n) {
    it.placed = true; as.sel = null; as.flash = {n, ok:true}; as.lastK = k;
    if (as.items.every(x => x.placed)) {
      as.done = true;
      S.sortRounds++;
      S.sortBest = S.sortBest == null ? as.errors : Math.min(S.sortBest, as.errors);
      save();
      haptic("success");
      island(as.errors === 0 ? "Fehlerfrei zugeordnet" : "Runde geschafft", "good");
    } else haptic("success");
  } else {
    as.errors++; as.flash = {n, ok:false};
    haptic("error");
    island(`${it.t} gehört nicht zu Schicht ${n}`, "bad");
  }
  drawUeben();
}
function newOrder() { od = {lang:od ? od.lang : "de", chips:shuffle([1, 2, 3, 4, 5, 6, 7]), next:1, errors:0, t0:null, time:0, done:false, flash:null, last:null}; }
function vUeben() {
  actHandler = (act, el) => {
    if (act === "tab") { if (ub.tab === el.dataset.v) return; ub.tab = el.dataset.v; clearInterval(odTimer); odTimer = null; haptic("select"); }
    if (act === "sel") { const k = +el.dataset.k; as.sel = as.sel === k ? null : k; haptic("select"); }
    if (act === "place") {
      if (as.sel == null) { haptic("light"); island("Wähle zuerst einen Begriff"); return; }
      placeAt(as.sel, +el.dataset.n); return;
    }
    if (act === "newassign") { newAssign(); haptic("medium"); }
    if (act === "lang") { if (od.lang === el.dataset.v) return; od.lang = el.dataset.v; haptic("select"); }
    if (act === "neworder") { clearInterval(odTimer); odTimer = null; newOrder(); haptic("medium"); }
    if (act === "ord") {
      const n = +el.dataset.n;
      if (od.done) return;
      if (!od.t0) od.t0 = Date.now();
      if (n === od.next) {
        od.last = n; od.next++;
        haptic(od.next > 7 ? "success" : "light");
        if (od.next > 7) {
          od.done = true; clearInterval(odTimer); odTimer = null;
          od.time = (Date.now() - od.t0) / 1000 + od.errors * 2;
          const best = S.orderBest == null || od.time < S.orderBest;
          if (best) S.orderBest = Math.round(od.time * 10) / 10;
          save();
          island(best ? "Neue Bestzeit" : "Geschafft", "good");
        }
      } else { od.errors++; od.flash = n; od.last = null; haptic("error"); island(`Gesucht ist Schicht ${od.next}`, "bad"); }
    }
    drawUeben();
  };
  drawUeben();
}
function assignHTML() {
  if (!as) newAssign();
  const placedN = as.items.filter(x => x.placed).length;
  const targets = [7, 6, 5, 4, 3, 2, 1].map(n => {
    const fl = as.flash && as.flash.n === n ? (as.flash.ok ? " flash-ok" : " flash-bad") : "";
    const placed = as.items.filter(x => x.placed && x.L === n).map(x => `<span class="chip${x.k === as.lastK && as.flash && as.flash.ok ? " new" : ""}">${x.t}</span>`).join("");
    return `<button class="target${as.sel != null ? " ready" : ""}${fl}" data-act="place" data-n="${n}" data-drop="${n}" ${as.done ? "disabled" : ""}>
      <span class="badge">${n}</span><span class="tg-main"><b>${L(n).de}</b><span class="placed">${placed}</span></span>${icon("plus", 20, "plus")}</button>`;

function orderHTML() {

        <p class="muted">Tippe die Schichten der Reihe nach an, beginnend mit Schicht 1. Die Zeit startet beim ersten Tippen, jeder Fehler kostet 2 Sekunden.</p>
        <div class="chips" style="margin-top:16px">${od.chips.filter(n => n >= od.next).map(n => `<button class="tchip${od.flash === n ? " shake" : ""}" data-act="ord" data-n="${n}">${name(n)}</button>`).join("")}</div>
        <div class="status" style="margin-top:18px"><span class="timer" id="odTime">${od.t0 ? fmtTime((Date.now() - od.t0) / 1000) : "0,0 s"}</span><span><b>${od.errors}</b> Fehler</span>${S.orderBest != null ? `<span>Bestzeit <b>${fmtTime(S.orderBest)}</b></span>` : ""}</div></div>`;
  return `<div class="order">${left}<div class="group">${slots}</div></div>`;

function drawUeben() {
  paint(`
  ${pageHero(MOD.osi.color, {kicker:"Anwenden", title:"Übungen", lede:"Ordne Begriffe der richtigen Schicht zu oder bring die Schichten auf Zeit in die richtige Reihenfolge."})}
  ${seg("utab", [["zuordnen", "Zuordnen"], ["reihenfolge", "Reihenfolge"]], ub.tab, "tab")}

document.addEventListener("dragstart", e => {
  const c = e.target instanceof Element && e.target.closest("[data-drag]");
  if (!c || !as) return;
  as.sel = +c.dataset.drag;
  e.dataTransfer.setData("text/plain", c.dataset.drag);
  e.dataTransfer.effectAllowed = "move";
  view.querySelectorAll(".target").forEach(t => t.classList.add("ready"));
});
document.addEventListener("dragover", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (t && as) { e.preventDefault(); t.classList.add("over"); }
});
document.addEventListener("dragleave", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (t) t.classList.remove("over");
});
document.addEventListener("drop", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (!t || !as) return;
  e.preventDefault();
