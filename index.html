/* ---------------- Kapselung ---------------- */
function vKapselung() {
  enc.prev = [];
  actHandler = (act, el) => {
    const last = ENCAP[enc.mode].length - 1, before = enc.i;
    if (act === "mode") { if (el.dataset.v === enc.mode) return; stopTimers(); enc.mode = el.dataset.v; enc.i = 0; enc.prev = []; haptic("select"); }
    if (act === "prev") { stopTimers(); enc.i = Math.max(0, enc.i - 1); }
    if (act === "next") { stopTimers(); enc.i = Math.min(last, enc.i + 1); }
    if (act === "jump") { stopTimers(); enc.i = +el.dataset.k; }
    if (act === "play") {
      haptic("medium");
      if (enc.playing) stopTimers();
      else {
        if (enc.i >= last) { enc.i = 0; enc.prev = []; }
        enc.playing = true;
        encTimer = setInterval(tickEnc, 3200);
      }
    }
    if (act !== "mode" && enc.i !== before) haptic("select");
    const hadFocus = el && el === document.activeElement;
    drawEnc(act === "mode" || enc.i !== before);
    if (hadFocus && ["prev", "next", "play"].includes(act)) {
      const b = view.querySelector(`[data-act="${act}"]:not([disabled])`) || view.querySelector('[data-act="play"]');
      if (b) b.focus({preventScroll:true});
    }
  };
  keyHandler = e => {
    if (e.key === "ArrowRight") { e.preventDefault(); actHandler("next"); }
    if (e.key === "ArrowLeft") { e.preventDefault(); actHandler("prev"); }
    if (e.key === " ") { e.preventDefault(); actHandler("play"); }
  };
  drawEnc(false);
}
function tickEnc() {
  const last = ENCAP[enc.mode].length - 1;
  if (enc.i < last) enc.i++;
  if (enc.i >= last) { clearInterval(encTimer); encTimer = null; enc.playing = false; }
  haptic("select");
  drawEnc(true);
}
const pduAt = n => n >= 5 ? "Daten" : n === 4 ? "Segment" : n === 3 ? "Paket" : n === 2 ? "Frame" : "Bits";
function wave(bits) {
  const w = 10, hi = 5, lo = 29;
  let x = 0, d = `M0 ${bits[0] === "1" ? hi : lo}`;
  for (const b of bits) d += ` V${b === "1" ? hi : lo} H${x += w}`;
  return `<svg class="wave" viewBox="0 0 ${bits.length * w} 34" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function blocksHTML(st, fresh) {
  if (st.blocks[0] === "bits") {
    return `<div class="packet"><div class="bits"><code>${BITS}</code>${wave(BITS.replace(/ /g, "").slice(48, 96))}<span class="muted small">Präambel und SFD (10101011) kündigen das Frame an, danach folgt die Ziel-MAC.</span></div></div>`;
  }
  return `<div class="packet">${st.blocks.map(b => {
    const d = BLK[b], leaving = st.drop && st.drop.includes(b), isFresh = fresh.includes(b);
    const cls = ["pkt", d.data ? "data" : "", isFresh ? "enter" : "", isFresh && !d.data && enc.mode === "send" ? "new" : "", leaving ? "leaving" : ""].filter(Boolean).join(" ");

  }).join("")}</div>`;
}

/* ---------------- Quiz ---------------- */
let qz = {phase:"intro"};
function arrange(o) {
  const items = o.map((t, i) => ({t, ok:i === 0}));
  const num = s => { const m = s.match(/\d+/); return m ? +m[0] : 0; };
  const sortable = items.every(x => /^(Schicht )?\d/.test(x.t));
  return sortable ? items.sort((a, b) => num(a.t) - num(b.t) || a.t.localeCompare(b.t)) : shuffle(items);
}
function startQuiz(mode) {
  let pool;
  const all = curMod.questions;
  if (mode === "quick") pool = shuffle(all).slice(0, 10);
  else if (mode === "big") pool = shuffle(all).slice(0, 25);
  else pool = shuffle(all.filter(q => S.wrong.includes(q.id)));
  if (!pool.length) { drawQuiz(); return; }
  haptic("medium");
  qz = {phase:"q", mod:curMod.id, mode, list:pool.map(q => ({...q, opts:arrange(q.o)})), i:0, answers:[], picked:null, fresh:true};
  drawQuiz();
  window.scrollTo(0, 0);
}
function pick(k) {
  if (qz.picked != null) return;
  const q = qz.list[qz.i], opt = q.opts[k];
  if (!opt) return;
  qz.picked = k; qz.fresh = false;
  qz.answers.push({id:q.id, ok:opt.ok, yours:opt.t, right:q.opts.find(x => x.ok).t});
  haptic(opt.ok ? "success" : "error");
  grade(q.id, opt.ok, opt.ok ? 10 : 1);
  tone(opt.ok);
  drawQuiz();
  pulse(opt.ok ? "var(--green)" : "var(--red)");
  if (opt.ok) floatXP($(".opt.ok"), "+10 XP");
  if (opt.ok && CFG.auto) setTimeout(() => { if (qz.phase === "q" && qz.list[qz.i] === q && qz.picked === k && parseHash().view === "quiz") { nextQ(); } }, 1100);
  const nb = $("#nextQ"); if (nb) nb.focus({preventScroll:true});
}
function nextQ() {
  if (qz.picked == null) return;
  haptic("light");
  qz.i++; qz.picked = null; qz.fresh = true;
  if (qz.i >= qz.list.length) finishQuiz();
  drawQuiz();
  window.scrollTo(0, 0);
}
function finishQuiz() {
  const right = qz.answers.filter(a => a.ok).length, p = pct(right, qz.answers.length);
  const st = qs();
  st.quizRuns++;
  st.quizHist = [...st.quizHist, p].slice(-12);
  if (qz.mode !== "wrong") st.quizBest = Math.max(st.quizBest || 0, p);
  const wrong = new Set(S.wrong);
  qz.answers.forEach(a => { if (a.ok) wrong.delete(a.id); else wrong.add(a.id); });
  S.wrong = [...wrong];
  save();
  qz.phase = "result"; qz.right = right; qz.pct = p;
  setTimeout(() => { haptic(p >= 80 ? "success" : "medium"); if (p >= 80) celebrate(); }, 300);
}
function vQuiz() {
  if (qz.phase !== "q" || qz.mod !== curMod.id) qz = {phase:"intro", mod:curMod.id};
  actHandler = (act, el) => {
    if (act === "start") startQuiz(el.dataset.m);

}
function newOrder() { od = {lang:od ? od.lang : "de", chips:shuffle([1, 2, 3, 4, 5, 6, 7]), next:1, errors:0, t0:null, time:0, done:false, flash:null, last:null}; }
function vUeben() {
  actHandler = (act, el) => {
    if (act === "tab") { if (ub.tab === el.dataset.v) return; ub.tab = el.dataset.v; clearInterval(odTimer); odTimer = null; haptic("select"); }
    if (act === "sel") { const k = +el.dataset.k; as.sel = as.sel === k ? null : k; haptic("select"); }
    if (act === "place") {
      if (as.sel == null) { haptic("light"); island("Wähle zuerst einen Begriff"); return; }
      placeAt(as.sel, +el.dataset.n); return;
    }
    if (act === "newassign") { newAssign(); haptic("medium"); }
    if (act === "lang") { if (od.lang === el.dataset.v) return; od.lang = el.dataset.v; haptic("select"); }
    if (act === "neworder") { clearInterval(odTimer); odTimer = null; newOrder(); haptic("medium"); }
    if (act === "ord") {
      const n = +el.dataset.n;
      if (od.done) return;
      if (!od.t0) od.t0 = Date.now();
      if (n === od.next) {
        od.last = n; od.next++;
        haptic(od.next > 7 ? "success" : "light");
        if (od.next > 7) {
          od.done = true; clearInterval(odTimer); odTimer = null;
          od.time = (Date.now() - od.t0) / 1000 + od.errors * 2;
          const best = S.orderBest == null || od.time < S.orderBest;
          if (best) S.orderBest = Math.round(od.time * 10) / 10;
          save();
          island(best ? "Neue Bestzeit" : "Geschafft", "good");
        }
      } else { od.errors++; od.flash = n; od.last = null; haptic("error"); island(`Gesucht ist Schicht ${od.next}`, "bad"); }
    }
    drawUeben();
  };
  drawUeben();
}
function assignHTML() {
  if (!as) newAssign();
  const placedN = as.items.filter(x => x.placed).length;
  const targets = [7, 6, 5, 4, 3, 2, 1].map(n => {
    const fl = as.flash && as.flash.n === n ? (as.flash.ok ? " flash-ok" : " flash-bad") : "";

    return `<button class="target${as.sel != null ? " ready" : ""}${fl}" data-act="place" data-n="${n}" data-drop="${n}" ${as.done ? "disabled" : ""}>
      <span class="badge">${n}</span><span class="tg-main"><b>${L(n).de}</b><span class="placed">${placed}</span></span>${icon("plus", 20, "plus")}</button>`;
  }).join("");
  const pool = as.done
    ? `<div class="card pool" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px">
        <span class="big-check">${icon("check", 32, "check-draw")}</span>

        <p class="muted">${as.items.length} Begriffe mit ${as.errors} ${as.errors === 1 ? "Fehler" : "Fehlern"}. Bestes Ergebnis bisher: ${S.sortBest} ${S.sortBest === 1 ? "Fehler" : "Fehler"}.</p>

    : `<div class="card pool"><div class="card-h"><h2 class="card-t">Begriffe</h2><span class="muted small">${as.sel != null ? "Jetzt die Schicht antippen" : "Antippen oder ziehen"}</span></div>

        <div class="status" style="margin-top:14px"><span><b>${placedN}</b> von ${as.items.length} zugeordnet</span><span><b>${as.errors}</b> Fehler</span></div></div>`;
  return `<div class="assign">${pool}<div class="group">${targets}</div></div>`;
}
function orderHTML() {
  if (!od) newOrder();
  const name = n => od.lang === "de" ? L(n).de : L(n).en;
  const slots = [7, 6, 5, 4, 3, 2, 1].map(n => n < od.next
    ? `<div class="slot filled${od.last === n ? " new" : ""}"><span class="badge sm">${n}</span>${name(n)}</div>`
    : `<div class="slot${n === od.next && !od.done ? " next" : ""}"><span class="badge sm">${n}</span>${n === od.next && !od.done ? "Welche Schicht gehört hierhin?" : "…"}</div>`).join("");
  const left = od.done
    ? `<div class="card" style="display:flex;flex-direction:column;align-items:flex-start;gap:12px">
        <span class="big-check">${icon("check", 32, "check-draw")}</span>
        <div class="timer">${fmtTime(od.time)}</div>
        <p class="muted">${od.errors ? `Inklusive ${od.errors * 2} s Strafzeit für ${od.errors} ${od.errors === 1 ? "Fehler" : "Fehler"}.` : "Ohne Fehler."} Bestzeit: ${fmtTime(S.orderBest)}</p>
        <button class="btn btn-fill" data-act="neworder">Nochmal</button></div>`
    : `<div class="card"><div class="card-h"><h2 class="card-t">${icon("timer")} Von unten nach oben</h2><div style="width:180px;max-width:100%">${seg("olang", [["de", "Deutsch"], ["en", "Englisch"]], od.lang, "lang")}</div></div>
        <p class="muted">Tippe die Schichten der Reihe nach an, beginnend mit Schicht 1. Die Zeit startet beim ersten Tippen, jeder Fehler kostet 2 Sekunden.</p>
        <div class="chips" style="margin-top:16px">${od.chips.filter(n => n >= od.next).map(n => `<button class="tchip${od.flash === n ? " shake" : ""}" data-act="ord" data-n="${n}">${name(n)}</button>`).join("")}</div>
        <div class="status" style="margin-top:18px"><span class="timer" id="odTime">${od.t0 ? fmtTime((Date.now() - od.t0) / 1000) : "0,0 s"}</span><span><b>${od.errors}</b> Fehler</span>${S.orderBest != null ? `<span>Bestzeit <b>${fmtTime(S.orderBest)}</b></span>` : ""}</div></div>`;
  return `<div class="order">${left}<div class="group">${slots}</div></div>`;
}
function drawUeben() {
  paint(`
  ${pageHero(MOD.osi.color, {kicker:"Anwenden", title:"Übungen", lede:"Ordne Begriffe der richtigen Schicht zu oder bring die Schichten auf Zeit in die richtige Reihenfolge."})}
  ${seg("utab", [["zuordnen", "Zuordnen"], ["reihenfolge", "Reihenfolge"]], ub.tab, "tab")}
  ${ub.tab === "zuordnen" ? assignHTML() : orderHTML()}`, {anim:false});
  if (as) as.flash = null;
  if (od) od.flash = null;
  if (ub.tab === "reihenfolge" && od && od.t0 && !od.done && !odTimer) {
    odTimer = setInterval(() => { const t = $("#odTime"); if (t && od && od.t0 && !od.done) t.textContent = fmtTime((Date.now() - od.t0) / 1000); }, 100);
  }
}
document.addEventListener("dragstart", e => {
  const c = e.target instanceof Element && e.target.closest("[data-drag]");
  if (!c || !as) return;
  as.sel = +c.dataset.drag;
  e.dataTransfer.setData("text/plain", c.dataset.drag);
  e.dataTransfer.effectAllowed = "move";
  view.querySelectorAll(".target").forEach(t => t.classList.add("ready"));
});
document.addEventListener("dragover", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (t && as) { e.preventDefault(); t.classList.add("over"); }
});
document.addEventListener("dragleave", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (t) t.classList.remove("over");
});
document.addEventListener("drop", e => {
  const t = e.target instanceof Element && e.target.closest("[data-drop]");
  if (!t || !as) return;
  e.preventDefault();
  const k = parseInt(e.dataTransfer.getData("text/plain"), 10);
  if (!isNaN(k)) placeAt(k, +t.dataset.drop);
});
